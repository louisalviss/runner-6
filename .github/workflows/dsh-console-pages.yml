name: Deploy DSH Console

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dsh-console/**"
      - ".github/workflows/dsh-console-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dsh-console-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload console
        uses: actions/upload-pages-artifact@v4
        with:
          path: dsh-console
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
