name: IBKR Reference RECREATE+ v0.11 via Existing DSH Slot

on:
  push:
    branches: [main]
    paths:
      - "anime-v09-dsh-delegated-trigger.txt"
  pull_request:
    branches: [main]
    paths:
      - "anime-v09-dsh-delegated-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      DSH_VERSION: "0.1.0-rc.7"
      PLAYWRIGHT_MCP_VERSION: "0.0.78"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install production tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl jq file librsvg2-bin
          bash scripts/setup-dsh-media-tools.sh

      - name: Configure DSH runtime
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          echo "DSH_HOME=$RUNNER_TEMP/dsh-home" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/dsh-home"
          cat > "$RUNNER_TEMP/dsh-home/settings.yaml" <<'YAML'
          llm-pi-ai:
            providers:
              openrouter-v4:
                displayName: OpenRouter DeepSeek V4 Pro
                apiKeyEnv: OPENROUTER_API_KEY
                api: openai-completions
                baseURL: https://openrouter.ai/api/v1
                compat:
                  thinkingFormat: openrouter
                models:
                  - id: deepseek/deepseek-v4-pro
                    name: DeepSeek V4 Pro
                    contextWindow: 1000000
                    maxTokens: 8192
                    input: [text]
          agent-default-model:
            provider: openrouter-v4
            model: deepseek/deepseek-v4-pro
          YAML
          chmod 600 "$RUNNER_TEMP/dsh-home/settings.yaml"

      - name: Restore DSH runtime
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/runner6-dsh-runtime
            ~/.npm
          key: runner6-dsh-runtime-${{ runner.os }}-rc7-pwmcp078-v1
          fail-on-cache-miss: false

      - name: Activate DSH and browser
        run: |
          set -euo pipefail
          bash scripts/activate-dsh-runtime.sh
          bash scripts/setup-dsh-playwright.sh .

      - name: DSH acquisition research and asset handoff
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p dsh-handoff/ibkr-recreate/raw
          TASK='You are the DHS/DSH ACQUISITION LAYER for a v0.11 RECREATE+ production. Do not design, edit, animate, or render the final video. The production assistant has already reverse-engineered a 14.9-second vertical Interactive Brokers options-spreads ad and will rebuild its UI/motion natively in Remotion. Your job is only to research the current public web with Playwright, compare plausible sources, select, and hand off authentic visual source assets/references. Required: (1) a clean high-resolution Interactive Brokers brand/logo asset suitable on a dark background, ideally transparent SVG/PNG; (2) a high-quality mobile-app/options UI reference image that helps validate authentic IBKR visual language. Do NOT choose based on download convenience. Prioritize semantic match, recognizability/authenticity, visual quality, useful resolution, crop resilience, and retrievability. No official-first or copyright-safe-first restriction; however the selected brand asset must actually represent Interactive Brokers. Compare at least 3 logo candidates and at least 3 UI-reference candidates. For EACH candidate include source_name, page_url, asset_url, notes. asset_url must be a direct public image/SVG URL that opens without login; verify it before selecting. Write dsh-handoff/ibkr-recreate/dsh-selection.json with EXACT top-level keys: selected_logo, logo_candidates, selected_ui_reference, ui_candidates, rationale. selected_logo and selected_ui_reference must each contain source_name,page_url,asset_url,why_selected. rationale must explain why these handoff assets are suitable for reconstructing this specific dark blue/teal vertical options ad. Finish with DSH_SELECTION_READY.'
          set +e
          timeout --signal=TERM --kill-after=10s 300s "$DSH_BIN" --profile headless "$TASK"
          CODE=$?
          set -e
          test -s dsh-handoff/ibkr-recreate/dsh-selection.json
          python3 - <<'PY'
          import json
          p=json.load(open('dsh-handoff/ibkr-recreate/dsh-selection.json'))
          assert len(p['logo_candidates']) >= 3
          assert len(p['ui_candidates']) >= 3
          assert p['selected_logo']['asset_url'].startswith('http')
          assert p['selected_ui_reference']['asset_url'].startswith('http')
          print(json.dumps(p,ensure_ascii=False,indent=2))
          PY
          if [ "$CODE" != 0 ] && [ "$CODE" != 124 ]; then exit "$CODE"; fi

      - name: Production assistant compositor render
        run: bash scripts/run-ibkr-recreate-ci.sh

      - name: Upload reconstruction handoff
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ibkr-recreate-v011-${{ github.run_id }}
          path: |
            dsh-handoff/ibkr-recreate/dsh-selection.json
            dsh-handoff/ibkr-recreate/raw/
            dsh-handoff/ibkr-recreate/final/ibkr_recreate_silent.mp4
            dsh-handoff/ibkr-recreate/final/qa-contact.jpg
            dsh-handoff/ibkr-recreate/final/qa.json
            dsh-handoff/ibkr-recreate/final/reconstruction-spec.json
          retention-days: 3
          if-no-files-found: warn
