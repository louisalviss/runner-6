name: IBKR Reference RECREATE+ v0.11 via Existing DSH Slot

on:
  push:
    branches: [main]
    paths:
      - "anime-v09-dsh-delegated-trigger.txt"
  pull_request:
    branches: [main]
    paths:
      - "anime-v09-dsh-delegated-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install native motion-graphics production tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg librsvg2-bin

      - name: Render routed Remotion/DOM/SVG reconstruction
        run: bash scripts/run-ibkr-recreate-ci.sh

      - name: Upload reconstruction candidate
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ibkr-recreate-v011-${{ github.run_id }}
          path: |
            dsh-handoff/ibkr-recreate/final/ibkr_recreate_silent.mp4
            dsh-handoff/ibkr-recreate/final/qa-contact.jpg
            dsh-handoff/ibkr-recreate/final/qa.json
            dsh-handoff/ibkr-recreate/final/reconstruction-spec.json
          retention-days: 3
          if-no-files-found: warn
