name: Anime Semantic v0.8 macOS Render

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "semantic-anime-v08-macos-trigger.txt"

permissions:
  contents: read
  actions: read

jobs:
  render:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install portable media stack
        run: |
          set -euo pipefail
          brew install ffmpeg coreutils
          CORE="$(brew --prefix coreutils)/libexec/gnubin"
          echo "$CORE" >> "$GITHUB_PATH"
          export PATH="$CORE:$PATH"
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          . .venv/bin/activate
          pip install --upgrade pip
          pip install numpy opencv-python-headless
          bash scripts/setup-dsh-media-tools.sh
      - name: Run semantic v0.8 pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/run-semantic-v08-ci.sh
      - name: Upload semantic v0.8 MP4 and QA
        uses: actions/upload-artifact@v4
        with:
          name: anime-semantic-v08-macos-${{ github.run_id }}
          path: |
            dsh-handoff/anime-semantic-v08-nc/reference-ranking.json
            dsh-handoff/anime-semantic-v08-nc/music-selection.json
            dsh-handoff/anime-semantic-v08-nc/source-selection.json
            dsh-handoff/anime-semantic-v08-nc/learned-combat-grammar.json
            dsh-handoff/anime-semantic-v08-nc/final/edit-plan.json
            dsh-handoff/anime-semantic-v08-nc/final/output-analysis/analysis.json
            dsh-handoff/anime-semantic-v08-nc/final/output-analysis/contact.jpg
            dsh-handoff/anime-semantic-v08-nc/final/SOURCE_MANIFEST.json
            dsh-handoff/anime-semantic-v08-nc/final/anime_combat_semantic_v08.mp4
          if-no-files-found: error
          retention-days: 2
