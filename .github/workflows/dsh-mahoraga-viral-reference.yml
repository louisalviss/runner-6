name: DSH Mahoraga viral reference

on:
  push:
    paths:
      - 'dsh-mahoraga-viral-reference-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Publish running status
        run: |
          set -euo pipefail
          printf '{"status":"running","run_id":"%s","artifact_present":false}\n' "$GITHUB_RUN_ID" > dsh-mahoraga-viral-reference-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dsh-mahoraga-viral-reference-status.json
          git commit -m 'Mahoraga viral reference running [skip ci]' || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Install ffmpeg and downloader
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-pil
          bash scripts/setup-dsh-media-tools.sh

      - name: Download viral Mahoraga reference
        run: |
          set -euo pipefail
          rm -rf dsh-handoff/downloads
          mkdir -p dsh-handoff/downloads reference-out
          bash scripts/dsh-download-media.sh 'https://www.youtube.com/watch?v=EqvJXq81jw8' 1080
          cp dsh-handoff/downloads/* reference-out/
          cp dsh-handoff/handoff.json reference-out/handoff.json

      - name: Probe and create analysis assets
        run: |
          set -euo pipefail
          V="$(find reference-out -maxdepth 1 -type f \( -name '*.mp4' -o -name '*.webm' -o -name '*.mkv' \) | head -n1)"
          test -n "$V"
          ffprobe -v error -show_streams -show_format -of json "$V" > reference-out/ffprobe.json
          mkdir -p reference-out/frames
          ffmpeg -y -v error -i "$V" -vf "fps=4,scale=480:-2" -q:v 2 reference-out/frames/f_%04d.jpg
          python - <<'PY'
          from PIL import Image, ImageDraw
          import glob, math
          files=glob.glob('reference-out/frames/*.jpg')[:80]
          thumbs=[]
          for i,p in enumerate(files):
              im=Image.open(p).convert('RGB')
              canvas=Image.new('RGB',(480,300),'black')
              canvas.paste(im,((480-im.width)//2,0))
              ImageDraw.Draw(canvas).text((8,276),f'{i/4:.2f}s',fill='white')
              thumbs.append(canvas)
          cols=4; rows=max(1,math.ceil(len(thumbs)/cols))
          out=Image.new('RGB',(480*cols,300*rows),'black')
          for i,im in enumerate(thumbs): out.paste(im,((i%cols)*480,(i//cols)*300))
          out.save('reference-out/contact_4fps.jpg',quality=92)
          PY

      - name: Upload reference
        uses: actions/upload-artifact@v4
        with:
          name: mahoraga-viral-reference-${{ github.run_id }}
          path: reference-out/
          retention-days: 2
          if-no-files-found: error

      - name: Publish final status
        if: always()
        run: |
          set -euo pipefail
          STATUS='${{ job.status }}'
          PRESENT=false
          if [ "$STATUS" = success ]; then PRESENT=true; fi
          printf '{"status":"%s","run_id":"%s","artifact_present":%s,"artifact_name":"mahoraga-viral-reference-%s"}\n' "$STATUS" "$GITHUB_RUN_ID" "$PRESENT" "$GITHUB_RUN_ID" > dsh-mahoraga-viral-reference-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dsh-mahoraga-viral-reference-status.json
          git commit -m 'Update Mahoraga viral reference status [skip ci]' || true
          git pull --rebase origin main
          git push origin HEAD:main
