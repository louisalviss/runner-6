name: Resolve X shortlink

on:
  push:
    branches: [main]
    paths:
      - resolve-x-shortlink-trigger.txt

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve and inspect
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request, re, html, time
          from html.parser import HTMLParser
          url='https://t.co/OAAowvtwaT'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/139 Safari/537.36','Accept-Language':'en-US,en;q=0.9'})
          out={'source':url,'checked_at_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())}
          try:
            with urllib.request.urlopen(req,timeout=25) as r:
              raw=r.read(500000); body=raw.decode('utf-8','replace')
              out.update(ok=True,status=getattr(r,'status',200),final_url=r.geturl(),content_type=r.headers.get('content-type',''))
              m=re.search(r'<title[^>]*>(.*?)</title>',body,re.I|re.S)
              out['title']=html.unescape(re.sub(r'<[^>]+>',' ',m.group(1))).strip() if m else None
              desc=None
              for key in ['og:description','description','twitter:description']:
                mm=re.search(r'<meta[^>]+(?:property|name)=["\']'+re.escape(key)+r'["\'][^>]+content=["\']([^"\']*)',body,re.I)
                if mm: desc=html.unescape(mm.group(1)); break
              out['description']=desc
              class T(HTMLParser):
                def __init__(self): super().__init__(); self.x=[]
                def handle_data(self,d): self.x.append(d)
              p=T(); p.feed(body); text=' '.join(' '.join(p.x).split())
              out['text_excerpt']=text[:15000]
          except Exception as e:
            out.update(ok=False,error=repr(e))
          open('resolve-x-shortlink-result.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          C=$(base64 -w0 resolve-x-shortlink-result.json)
          S=$(gh api "repos/$GITHUB_REPOSITORY/contents/resolve-x-shortlink-result.json?ref=main" --jq .sha 2>/dev/null || true)
          if [ -n "$S" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/resolve-x-shortlink-result.json" -f message='Update X shortlink result [skip ci]' -f content="$C" -f sha="$S" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/resolve-x-shortlink-result.json" -f message='Store X shortlink result [skip ci]' -f content="$C" -f branch=main >/dev/null
          fi
