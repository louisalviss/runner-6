name: DSH Mahoraga TikTok reference

on:
  push:
    branches:
      - feature/dsh-tiktok-resolver
    paths:
      - 'dsh-mahoraga-tiktok-reference-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Publish running status
        run: |
          set -euo pipefail
          printf '{"status":"running","run_id":"%s","artifact_present":false}\n' "$GITHUB_RUN_ID" > dsh-mahoraga-tiktok-reference-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dsh-mahoraga-tiktok-reference-status.json
          git commit -m 'TikTok reference running [skip ci]' || true
          git pull --rebase origin feature/dsh-tiktok-resolver
          git push origin HEAD:feature/dsh-tiktok-resolver

      - name: Install media QA tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-pil

      - name: Resolve and download original TikTok reference
        run: |
          set -uo pipefail
          rm -rf reference-out
          mkdir -p reference-out

          resolve() {
            python3 scripts/dsh-download-tiktok-reference.py \
              --username divine_daniel21 \
              --query 'Mahoraga x The Largest' \
              --out-dir reference-out
          }

          set +e
          resolve
          CODE=$?
          set -e

          if [ "$CODE" -ne 0 ]; then
            echo 'Direct TikTok metadata route blocked; retrying through Cloudflare WARP.' >&2
            rm -rf reference-out
            mkdir -p reference-out
            bash scripts/setup-cloudflare-warp.sh
            set +e
            resolve
            CODE=$?
            set -e
            warp-cli --accept-tos disconnect >/dev/null 2>&1 || true
          fi

          if [ "$CODE" -ne 0 ]; then
            echo 'TikTok resolver failed both direct and WARP routes.' >&2
            exit "$CODE"
          fi

      - name: Build frame analysis assets
        run: |
          set -euo pipefail
          V="$(find reference-out -maxdepth 1 -type f -name '*.mp4' | head -n1)"
          test -n "$V"
          mkdir -p reference-out/frames
          ffmpeg -y -v error -i "$V" -vf 'fps=6,scale=640:-2' -q:v 2 reference-out/frames/f_%04d.jpg
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import glob, math
          files=glob.glob('reference-out/frames/*.jpg')[:120]
          thumbs=[]
          for i,p in enumerate(files):
              im=Image.open(p).convert('RGB')
              canvas=Image.new('RGB',(640,400),'black')
              y=(400-im.height)//2
              canvas.paste(im,((640-im.width)//2,y))
              ImageDraw.Draw(canvas).text((8,376),f'{i/6:.3f}s',fill='white')
              thumbs.append(canvas)
          cols=3; rows=max(1,math.ceil(len(thumbs)/cols))
          out=Image.new('RGB',(640*cols,400*rows),'black')
          for i,im in enumerate(thumbs): out.paste(im,((i%cols)*640,(i//cols)*400))
          out.save('reference-out/contact_6fps.jpg',quality=90)
          PY

      - name: Detect hard cuts
        run: |
          set -euo pipefail
          V="$(find reference-out -maxdepth 1 -type f -name '*.mp4' | head -n1)"
          ffmpeg -hide_banner -i "$V" -filter_complex "select='gt(scene,0.28)',metadata=print:file=reference-out/scene-cuts.txt" -an -f null - 2>/dev/null || true

      - name: Upload direct TikTok reference
        uses: actions/upload-artifact@v4
        with:
          name: mahoraga-tiktok-reference-${{ github.run_id }}
          path: reference-out/
          retention-days: 2
          compression-level: 0
          if-no-files-found: error

      - name: Publish final status
        if: always()
        run: |
          set -euo pipefail
          STATUS='${{ job.status }}'
          PRESENT=false
          META='{}'
          if [ -f reference-out/tiktok-reference.json ]; then
            PRESENT=true
            META="$(python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('reference-out/tiktok-reference.json')
          d=json.loads(p.read_text())
          keep={k:d.get(k) for k in ['resolver','username','title','video_id','original_tiktok_url','play_count','digg_count','bytes']}
          print(json.dumps(keep,separators=(',',':')))
          PY
            )"
          fi
          python3 - "$STATUS" "$GITHUB_RUN_ID" "$PRESENT" "$META" <<'PY'
          import json,sys
          status,run_id,present,meta=sys.argv[1:]
          out={'status':status,'run_id':run_id,'artifact_present':present=='true'}
          try: out['reference']=json.loads(meta)
          except: pass
          open('dsh-mahoraga-tiktok-reference-status.json','w').write(json.dumps(out,separators=(',',':'))+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dsh-mahoraga-tiktok-reference-status.json
          git commit -m 'Update TikTok reference status [skip ci]' || true
          git pull --rebase origin feature/dsh-tiktok-resolver
          git push origin HEAD:feature/dsh-tiktok-resolver
