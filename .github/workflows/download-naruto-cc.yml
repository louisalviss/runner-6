name: Download Naruto CC video

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/download-naruto-cc.yml"
      - "naruto-download-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runner-6-naruto-cc-download
  cancel-in-progress: true

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Publish run marker
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('naruto-download-status.json').write_text(json.dumps({
              'status': 'started',
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'sha': os.environ.get('GITHUB_SHA'),
          }, indent=2) + '\n')
          PY
          cp naruto-download-status.json "$RUNNER_TEMP/status.json"
          git fetch origin main
          git reset --hard origin/main
          cp "$RUNNER_TEMP/status.json" naruto-download-status.json
          git config user.name "runner-6-media-bot"
          git config user.email "runner-6-media-bot@users.noreply.github.com"
          git add naruto-download-status.json
          git commit -m "Naruto CC download started [skip ci]" || exit 0
          git push origin HEAD:main

      - name: Install yt-dlp with YouTube EJS support
        run: python -m pip install --disable-pip-version-check -q -U 'yt-dlp[default]'

      - name: Pick first Naruto video from YouTube Creative Commons filter
        id: find
        run: |
          set -euo pipefail
          mkdir -p download
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path

          search_url = 'https://www.youtube.com/results?search_query=Naruto&sp=EgIwAQ%3D%3D'
          p = subprocess.run([
              'yt-dlp', '--flat-playlist', '--dump-json', '--no-warnings',
              '--playlist-end', '30', search_url
          ], text=True, capture_output=True, timeout=90)
          if p.returncode != 0:
              Path('/tmp/find_status.json').write_text(json.dumps({
                  'status': 'cc_search_failed',
                  'stderr': p.stderr[-4000:],
              }, indent=2) + '\n')
              sys.exit(5)

          chosen = None
          for line in p.stdout.splitlines():
              try:
                  row = json.loads(line)
              except Exception:
                  continue
              vid = row.get('id')
              if not vid or len(vid) != 11:
                  continue
              duration = row.get('duration') or 0
              if duration and duration > 900:
                  continue
              chosen = {
                  'id': vid,
                  'url': f'https://www.youtube.com/watch?v={vid}',
                  'title': row.get('title'),
                  'uploader': row.get('uploader') or row.get('channel'),
                  'duration': duration,
                  'license': 'Creative Commons (selected by YouTube native CC filter)',
                  'license_verified_by': 'youtube_native_cc_search_filter',
                  'search_url': search_url,
              }
              break

          if not chosen:
              Path('/tmp/find_status.json').write_text(json.dumps({
                  'status': 'no_cc_candidate_from_native_filter',
              }, indent=2) + '\n')
              sys.exit(4)

          Path('download/source.json').write_text(json.dumps(chosen, ensure_ascii=False, indent=2) + '\n')
          Path('/tmp/chosen_url.txt').write_text(chosen['url'])
          Path('/tmp/find_status.json').write_text(json.dumps({'status': 'found', **chosen}, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(chosen, ensure_ascii=False))
          PY

      - name: Download selected video
        if: steps.find.outcome == 'success'
        run: |
          set -euo pipefail
          URL="$(cat /tmp/chosen_url.txt)"
          yt-dlp \
            --js-runtimes node \
            --remote-components ejs:github \
            --max-filesize 200M \
            -f 'b[height<=720]/b' \
            -o 'download/naruto_cc.%(ext)s' \
            "$URL"
          ls -lh download

      - name: Build result
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          source = {}
          if Path('download/source.json').exists():
              source = json.loads(Path('download/source.json').read_text())
          find_status = {}
          if Path('/tmp/find_status.json').exists():
              find_status = json.loads(Path('/tmp/find_status.json').read_text())
          videos = [p for p in Path('download').glob('naruto_cc.*') if p.is_file()]
          if videos:
              status = 'success'
          elif source:
              status = 'download_failed'
          elif find_status.get('status'):
              status = find_status.get('status')
          else:
              status = 'download_failed'
          result = {
              'status': status,
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'sha': os.environ.get('GITHUB_SHA'),
              'title': source.get('title'),
              'video_id': source.get('id'),
              'source_url': source.get('url'),
              'license': source.get('license'),
              'license_verified_by': source.get('license_verified_by'),
              'uploader': source.get('uploader'),
              'duration': source.get('duration'),
              'file': videos[0].name if videos else None,
              'bytes': videos[0].stat().st_size if videos else None,
              'artifact_name': f"naruto-cc-{os.environ.get('GITHUB_RUN_ID')}",
          }
          Path('naruto-download-result.json').write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n')
          Path('naruto-download-status.json').write_text(json.dumps({
              'status': status,
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'sha': os.environ.get('GITHUB_SHA'),
              'artifact_name': result['artifact_name'],
          }, indent=2) + '\n')
          PY

      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naruto-cc-${{ github.run_id }}
          path: |
            download/
            naruto-download-result.json
          retention-days: 7

      - name: Persist result metadata
        if: always()
        run: |
          set -euo pipefail
          cp naruto-download-result.json "$RUNNER_TEMP/result.json"
          cp naruto-download-status.json "$RUNNER_TEMP/status-final.json"
          git fetch origin main
          git reset --hard origin/main
          cp "$RUNNER_TEMP/result.json" naruto-download-result.json
          cp "$RUNNER_TEMP/status-final.json" naruto-download-status.json
          git config user.name "runner-6-media-bot"
          git config user.email "runner-6-media-bot@users.noreply.github.com"
          git add naruto-download-result.json naruto-download-status.json
          git commit -m "Update Naruto CC download result [skip ci]" || exit 0
          git push origin HEAD:main

      - name: Validate
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('naruto-download-result.json').read_text())
          if r.get('status') != 'success':
              raise SystemExit(f"Download failed: {r.get('status')}")
          print(r['title'])
          print(r['license'])
          print(r['file'])
          PY
