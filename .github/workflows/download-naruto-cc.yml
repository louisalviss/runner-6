name: Download Naruto CC video

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/download-naruto-cc.yml"
      - "naruto-download-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runner-6-naruto-cc-download
  cancel-in-progress: true

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: python -m pip install --disable-pip-version-check -q -U yt-dlp

      - name: Find Creative Commons Naruto video
        id: find
        run: |
          set -euo pipefail
          mkdir -p download
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path

          queries = [
              'Naruto',
              'Naruto anime',
              'Naruto fan animation',
              'Naruto review',
          ]
          seen = set()
          chosen = None

          def run(args, timeout=60):
              return subprocess.run(args, text=True, capture_output=True, timeout=timeout)

          for query in queries:
              p = run(['yt-dlp', '--flat-playlist', '--dump-json', '--no-warnings', f'ytsearch30:{query}'], timeout=90)
              if p.returncode != 0:
                  continue
              for line in p.stdout.splitlines():
                  try:
                      row = json.loads(line)
                  except Exception:
                      continue
                  vid = row.get('id')
                  if not vid or vid in seen:
                      continue
                  seen.add(vid)
                  url = f'https://www.youtube.com/watch?v={vid}'
                  q = run(['yt-dlp', '--skip-download', '--dump-single-json', '--no-warnings', url], timeout=60)
                  if q.returncode != 0:
                      continue
                  try:
                      info = json.loads(q.stdout)
                  except Exception:
                      continue
                  lic = str(info.get('license') or '')
                  title = str(info.get('title') or '')
                  duration = info.get('duration') or 0
                  live = info.get('is_live')
                  if 'creative commons' not in lic.lower():
                      continue
                  if duration and duration > 1800:
                      continue
                  if live:
                      continue
                  chosen = {
                      'id': vid,
                      'url': url,
                      'title': title,
                      'license': lic,
                      'uploader': info.get('uploader'),
                      'duration': duration,
                      'webpage_url': info.get('webpage_url') or url,
                  }
                  break
              if chosen:
                  break

          if not chosen:
              Path('naruto-download-result.json').write_text(json.dumps({
                  'status': 'no_creative_commons_candidate',
                  'searched': len(seen),
              }, indent=2) + '\n')
              sys.exit(4)

          Path('download/source.json').write_text(json.dumps(chosen, ensure_ascii=False, indent=2) + '\n')
          Path('/tmp/chosen_url.txt').write_text(chosen['url'])
          print(json.dumps(chosen, ensure_ascii=False))
          PY

      - name: Download selected video
        run: |
          set -euo pipefail
          URL="$(cat /tmp/chosen_url.txt)"
          yt-dlp \
            --no-warnings \
            --max-filesize 200M \
            -f 'best[ext=mp4][height<=720]/best[height<=720]/best' \
            -o 'download/naruto_cc.%(ext)s' \
            "$URL"
          ls -lh download

      - name: Build result
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          source = {}
          if Path('download/source.json').exists():
              source = json.loads(Path('download/source.json').read_text())
          videos = [p for p in Path('download').glob('naruto_cc.*') if p.is_file()]
          result = {
              'status': 'success' if videos else ('no_creative_commons_candidate' if Path('naruto-download-result.json').exists() else 'download_failed'),
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'sha': os.environ.get('GITHUB_SHA'),
              'title': source.get('title'),
              'video_id': source.get('id'),
              'source_url': source.get('webpage_url'),
              'license': source.get('license'),
              'uploader': source.get('uploader'),
              'duration': source.get('duration'),
              'file': videos[0].name if videos else None,
              'bytes': videos[0].stat().st_size if videos else None,
              'artifact_name': f"naruto-cc-{os.environ.get('GITHUB_RUN_ID')}",
          }
          Path('naruto-download-result.json').write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naruto-cc-${{ github.run_id }}
          path: |
            download/
            naruto-download-result.json
          retention-days: 7

      - name: Persist result metadata
        if: always()
        run: |
          set -euo pipefail
          cp naruto-download-result.json "$RUNNER_TEMP/naruto-download-result.json"
          git fetch origin main
          git reset --hard origin/main
          cp "$RUNNER_TEMP/naruto-download-result.json" naruto-download-result.json
          git config user.name "runner-6-media-bot"
          git config user.email "runner-6-media-bot@users.noreply.github.com"
          git add naruto-download-result.json
          git commit -m "Update Naruto CC download result [skip ci]" || exit 0
          git push origin HEAD:main

      - name: Validate
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('naruto-download-result.json').read_text())
          if r.get('status') != 'success':
              raise SystemExit(f"Download failed: {r.get('status')}")
          print(r['title'])
          print(r['license'])
          print(r['file'])
          PY
