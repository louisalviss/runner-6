name: Fix DSH Chat Stale Lock

on:
  push:
    branches: [main]
    paths:
      - "fix-dsh-chat-stale-lock-trigger.txt"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fix-dsh-chat-stale-lock
  cancel-in-progress: true

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Patch stale pending recovery
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('dsh-console/index.html')
          s=p.read_text()
          old="""async function load(){try{messages=JSON.parse(localStorage.getItem(HIST)||'[]');if(!Array.isArray(messages))messages=[]}catch{messages=[]}token.value=localStorage.getItem(TOKEN_KEY)||'';render();paintEnc();await syncPublishedEncryption();const p=[...messages].reverse().find(m=>m.pending&&m.clientId);if(p){pendingLocalId=p.id;activeClientId=p.clientId;send.disabled=true;startPoll()}else paintEnc()}"""
          new="""async function load(){try{messages=JSON.parse(localStorage.getItem(HIST)||'[]');if(!Array.isArray(messages))messages=[]}catch{messages=[]}token.value=localStorage.getItem(TOKEN_KEY)||'';render();paintEnc();await syncPublishedEncryption();const p=[...messages].reverse().find(m=>m.pending&&m.clientId);if(p){const age=now()-(Number(p.ts)||0);if(age>5*60*1000){updateMsg(p.id,{pending:false,text:'Previous turn expired. Send again.',error:true});localStorage.removeItem(PEND+p.clientId);pendingLocalId=null;activeClientId=null;send.disabled=false;paintEnc()}else{pendingLocalId=p.id;activeClientId=p.clientId;send.disabled=true;startPoll()}}else paintEnc()}"""
          if old not in s: raise SystemExit('load() target not found')
          s=s.replace(old,new,1)

          old2="""async function refresh(silent=false){try{const s=await repoJson('dsh-status.json');if(!pendingLocalId||!activeClientId)return s;if(String(s.client_id||'')!==String(activeClientId))return s;paintStatus(s);if(s.status==='started')return s;"""
          new2="""async function refresh(silent=false){try{const s=await repoJson('dsh-status.json');if(!pendingLocalId||!activeClientId)return s;if(String(s.client_id||'')!==String(activeClientId)){const m=messages.find(x=>x.id===pendingLocalId);if(m&&now()-(Number(m.ts)||0)>5*60*1000)finishError('Request expired before Runner acknowledged it. Send again.');return s}paintStatus(s);if(s.status==='started')return s;"""
          if old2 not in s: raise SystemExit('refresh() target not found')
          s=s.replace(old2,new2,1)

          old3="""}catch(e){add('assistant',e.message,{error:true});send.disabled=false;$('orb').className='orb error';if(e.message.includes('Settings')||e.message.includes('encryption'))openSheet()}}"""
          new3="""}catch(e){if(pendingLocalId)finishError(e.message);else add('assistant',e.message,{error:true});send.disabled=false;$('orb').className='orb error';if(e.message.includes('Settings')||e.message.includes('encryption'))openSheet()}}"""
          if old3 not in s: raise SystemExit('send catch target not found')
          s=s.replace(old3,new3,1)
          p.write_text(s)
          PY

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dsh-console/index.html
          git commit -m 'Fix DSH chat stale pending lock [skip ci]'
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dsh-console
      - id: deployment
        uses: actions/deploy-pages@v4
