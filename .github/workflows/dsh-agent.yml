name: Runner 6 DSH Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: "One-shot task for DeepSeek Harness"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/dsh-agent.yml"
      - "dsh-request.txt"

permissions:
  contents: write

concurrency:
  group: runner-6-dsh-agent
  cancel-in-progress: true

jobs:
  dsh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DSH_VERSION: "0.1.0-rc.7"
      DSH_HOME: ${{ runner.temp }}/dsh-home
      DSH_PROVIDER: "openrouter-v4"
      DSH_MODEL: "deepseek/deepseek-v4-pro"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Resolve task
        env:
          INPUT_TASK: ${{ github.event.inputs.task }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TASK:-}" ]; then
            printf '%s\n' "$INPUT_TASK" > "$RUNNER_TEMP/dsh-task.txt"
          elif [ -f dsh-request.txt ]; then
            cp dsh-request.txt "$RUNNER_TEMP/dsh-task.txt"
          else
            printf '%s\n' 'Reply exactly: DSH_OK' > "$RUNNER_TEMP/dsh-task.txt"
          fi

          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/dsh-task.txt"; then
            echo 'Task is blank.' >&2
            exit 2
          fi

          if grep -qx '__SMOKE_TOOL__' "$RUNNER_TEMP/dsh-task.txt"; then
            TOKEN="DSH_TOOL_OK_$(python - <<'PY'
          import secrets
          print(secrets.token_hex(16))
          PY
          )"
            printf '%s\n' "$TOKEN" > dsh-probe.txt
            printf '%s\n' "$TOKEN" > "$RUNNER_TEMP/dsh-expected.txt"
            cat > "$RUNNER_TEMP/dsh-task.txt" <<'EOF'
          Use an available filesystem-reading tool to read the file dsh-probe.txt in the current workspace. You must inspect the file; do not guess its contents. Reply with exactly the file contents and nothing else.
          EOF
          fi

      - name: Publish run marker
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('dsh-status.json').write_text(json.dumps({
              'status': 'started',
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'sha': os.environ.get('GITHUB_SHA'),
              'provider': os.environ.get('DSH_PROVIDER'),
              'model': os.environ.get('DSH_MODEL'),
              'dsh_version': os.environ.get('DSH_VERSION'),
          }, indent=2) + '\n')
          PY
          cp dsh-status.json "$RUNNER_TEMP/dsh-status-started.json"
          git fetch origin main
          git reset --hard origin/main
          cp "$RUNNER_TEMP/dsh-status-started.json" dsh-status.json
          git config user.name "runner-6-dsh-bot"
          git config user.email "runner-6-dsh-bot@users.noreply.github.com"
          git add dsh-status.json
          git commit -m "DSH run started [skip ci]" || exit 0
          git push origin HEAD:main

      - name: Configure OpenRouter provider
        run: |
          set -euo pipefail
          mkdir -p "$DSH_HOME"
          cat > "$DSH_HOME/settings.yaml" <<'YAML'
          llm-pi-ai:
            providers:
              openrouter-v4:
                displayName: OpenRouter DeepSeek V4 Pro
                apiKeyEnv: OPENROUTER_API_KEY
                api: openai-completions
                baseURL: https://openrouter.ai/api/v1
                compat:
                  thinkingFormat: openrouter
                models:
                  - id: deepseek/deepseek-v4-pro
                    name: DeepSeek V4 Pro
                    contextWindow: 1000000
                    maxTokens: 32768
                    input:
                      - text
          agent-default-model:
            provider: openrouter-v4
            model: deepseek/deepseek-v4-pro
          YAML
          chmod 600 "$DSH_HOME/settings.yaml"

      - name: Run DSH headless through OpenRouter
        id: run_dsh
        env:
          OPENROUTER_API_KEY_SECRET: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -uo pipefail
          TASK="$(cat "$RUNNER_TEMP/dsh-task.txt")"

          if [ -z "${OPENROUTER_API_KEY_SECRET:-}" ]; then
            printf '%s\n' 'OPENROUTER_API_KEY repository secret is missing.' > "$RUNNER_TEMP/dsh-output.txt"
            : > "$RUNNER_TEMP/dsh-error.txt"
            echo 'missing_key=true' >> "$GITHUB_OUTPUT"
            echo 'exit_code=3' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          export OPENROUTER_API_KEY="$OPENROUTER_API_KEY_SECRET"
          set +e
          npx --yes "@deepseek-ai/dsh@$DSH_VERSION" --profile headless "$TASK" \
            > "$RUNNER_TEMP/dsh-output.txt" \
            2> "$RUNNER_TEMP/dsh-error.txt"
          CODE=$?
          set -e

          echo 'missing_key=false' >> "$GITHUB_OUTPUT"
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build result
        if: always()
        env:
          DSH_MISSING_KEY: ${{ steps.run_dsh.outputs.missing_key }}
          DSH_EXIT_CODE: ${{ steps.run_dsh.outputs.exit_code }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          tmp = Path(os.environ['RUNNER_TEMP'])
          task = (tmp / 'dsh-task.txt').read_text(errors='replace') if (tmp / 'dsh-task.txt').exists() else ''
          out = (tmp / 'dsh-output.txt').read_text(errors='replace') if (tmp / 'dsh-output.txt').exists() else ''
          err = (tmp / 'dsh-error.txt').read_text(errors='replace') if (tmp / 'dsh-error.txt').exists() else ''
          expected = (tmp / 'dsh-expected.txt').read_text(errors='replace').strip() if (tmp / 'dsh-expected.txt').exists() else None
          missing = os.environ.get('DSH_MISSING_KEY') == 'true'
          try:
              code = int(os.environ.get('DSH_EXIT_CODE') or 1)
          except ValueError:
              code = 1

          tool_smoke = expected is not None
          tool_smoke_passed = tool_smoke and out.strip() == expected

          if missing:
              status = 'missing_openrouter_key'
          elif code != 0:
              status = 'error'
          elif tool_smoke and tool_smoke_passed:
              status = 'success_tool_smoke'
          elif tool_smoke:
              status = 'tool_smoke_mismatch'
          else:
              status = 'success'

          result = {
              'status': status,
              'provider': os.environ.get('DSH_PROVIDER'),
              'model': os.environ.get('DSH_MODEL'),
              'dsh_version': os.environ.get('DSH_VERSION'),
              'exit_code': code,
              'tool_smoke': tool_smoke,
              'tool_smoke_passed': tool_smoke_passed,
              'task': task[:20000],
              'output': out[:100000],
              'stderr': err[:50000],
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'sha': os.environ.get('GITHUB_SHA'),
          }
          Path('dsh-result.json').write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n')
          Path('dsh-status.json').write_text(json.dumps({
              'status': status,
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'sha': os.environ.get('GITHUB_SHA'),
              'provider': os.environ.get('DSH_PROVIDER'),
              'model': os.environ.get('DSH_MODEL'),
              'exit_code': code,
              'tool_smoke_passed': tool_smoke_passed,
          }, indent=2) + '\n')
          PY

      - name: Upload DSH result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-result-${{ github.run_id }}
          path: |
            dsh-result.json
            dsh-status.json
          retention-days: 7

      - name: Persist result and status
        if: always()
        run: |
          set -euo pipefail
          cp dsh-result.json "$RUNNER_TEMP/dsh-result-final.json"
          cp dsh-status.json "$RUNNER_TEMP/dsh-status-final.json"
          git fetch origin main
          git reset --hard origin/main
          cp "$RUNNER_TEMP/dsh-result-final.json" dsh-result.json
          cp "$RUNNER_TEMP/dsh-status-final.json" dsh-status.json
          git config user.name "runner-6-dsh-bot"
          git config user.email "runner-6-dsh-bot@users.noreply.github.com"
          git add dsh-result.json dsh-status.json
          git commit -m "Update DSH OpenRouter result [skip ci]" || exit 0
          git push origin HEAD:main

      - name: Validate result
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('dsh-result.json').read_text())
          if result['status'] not in {'success', 'success_tool_smoke'}:
              raise SystemExit(f"DSH validation failed: {result['status']}")
          print(f"DSH validation passed: {result['status']}")
          PY
