name: DSH Browser Smoke V3

on:
  push:
    branches: [main]
    paths:
      - "dsh-browser-smoke-v3-request.txt"

permissions:
  contents: write

concurrency:
  group: runner-6-dsh-browser-smoke-v3
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      DSH_VERSION: "0.1.0-rc.7"
      PLAYWRIGHT_MCP_VERSION: "0.0.78"

    steps:
      - uses: actions/checkout@v4
        with:
          path: workspace
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Runtime paths
        run: echo "DSH_HOME=$RUNNER_TEMP/dsh-home" >> "$GITHUB_ENV"
      - name: Decrypt smoke task
        env:
          DSH_CHAT_PRIVATE_KEY_B64: ${{ secrets.DSH_CHAT_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          node workspace/scripts/dsh-handoff-crypto.mjs decrypt-envelope \
            workspace/dsh-browser-smoke-v3-request.txt \
            "$RUNNER_TEMP/task.txt" "$RUNNER_TEMP/session-key.b64" "$RUNNER_TEMP/client-id.txt"
      - name: Publish start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CID="$(cat "$RUNNER_TEMP/client-id.txt")"
          printf '{"status":"started","run_id":"%s","client_id":"%s","browser":"playwright-mcp-v3"}\n' "$GITHUB_RUN_ID" "$CID" > "$RUNNER_TEMP/status.json"
          C="$(base64 -w0 "$RUNNER_TEMP/status.json")"; S="$(gh api "repos/$GITHUB_REPOSITORY/contents/dsh-browser-smoke-v3-status.json?ref=main" --jq .sha 2>/dev/null || true)"
          if [ -n "$S" ]; then gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/dsh-browser-smoke-v3-status.json" -f message='Browser smoke v3 started [skip ci]' -f content="$C" -f sha="$S" -f branch=main >/dev/null; else gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/dsh-browser-smoke-v3-status.json" -f message='Browser smoke v3 started [skip ci]' -f content="$C" -f branch=main >/dev/null; fi
      - name: Configure OpenRouter
        run: |
          mkdir -p "$DSH_HOME"
          cat > "$DSH_HOME/settings.yaml" <<'YAML'
          llm-pi-ai:
            providers:
              openrouter-v4:
                displayName: OpenRouter DeepSeek V4 Pro
                apiKeyEnv: OPENROUTER_API_KEY
                api: openai-completions
                baseURL: https://openrouter.ai/api/v1
                compat:
                  thinkingFormat: openrouter
                models:
                  - id: deepseek/deepseek-v4-pro
                    name: DeepSeek V4 Pro
                    contextWindow: 1000000
                    maxTokens: 8192
                    input: [text]
          agent-default-model:
            provider: openrouter-v4
            model: deepseek/deepseek-v4-pro
          YAML
          chmod 600 "$DSH_HOME/settings.yaml"
      - name: Restore verified DSH runtime
        id: runtime_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/runner6-dsh-runtime
            ~/.npm
          key: runner6-dsh-runtime-${{ runner.os }}-rc7-pwmcp078-v1
          fail-on-cache-miss: true
      - name: Activate verified runtime
        run: bash workspace/scripts/activate-dsh-runtime.sh
      - name: Configure Playwright MCP
        run: bash workspace/scripts/setup-dsh-playwright.sh workspace
      - name: Sanity DSH
        run: timeout 20s "$DSH_BIN" --version
      - name: Run DSH browser turn
        id: dsh
        working-directory: workspace
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -uo pipefail
          TASK="$(cat "$RUNNER_TEMP/task.txt")"
          set +e
          timeout --signal=TERM --kill-after=10s 180s "$DSH_BIN" --profile headless "$TASK" > "$RUNNER_TEMP/output.txt" 2> "$RUNNER_TEMP/error.txt"
          CODE=$?
          set -e
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          unset TASK OPENROUTER_API_KEY
      - name: Inspect browser files
        id: files
        run: |
          set -euo pipefail
          find workspace/dsh-handoff -type f -size +0c -print 2>/dev/null > "$RUNNER_TEMP/files.txt" || true
          COUNT="$(wc -l < "$RUNNER_TEMP/files.txt" | tr -d ' ')"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          [ "$COUNT" -gt 0 ] && echo 'present=true' >> "$GITHUB_OUTPUT" || echo 'present=false' >> "$GITHUB_OUTPUT"
      - name: Upload browser artifact
        if: steps.files.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dsh-browser-smoke-v3-${{ github.run_id }}
          path: workspace/dsh-handoff/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Build encrypted result
        if: always()
        env:
          EXIT_CODE: ${{ steps.dsh.outputs.exit_code }}
          FILE_PRESENT: ${{ steps.files.outputs.present }}
          FILE_COUNT: ${{ steps.files.outputs.count }}
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/session-key.b64" || exit 0
          python - <<'PY'
          import json,os
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP']); code=int(os.environ.get('EXIT_CODE') or 1); present=os.environ.get('FILE_PRESENT')=='true'
          result={'status':'success' if code==0 else ('timeout' if code in (124,137) else 'error'),'output':(t/'output.txt').read_text(errors='replace')[:100000] if (t/'output.txt').exists() else '','stderr':(t/'error.txt').read_text(errors='replace')[:50000] if (t/'error.txt').exists() else '','exit_code':code,'run_id':os.environ['GITHUB_RUN_ID'],'client_id':(t/'client-id.txt').read_text().strip(),'browser':'playwright-mcp-v3','artifact_present':present,'artifact_count':int(os.environ.get('FILE_COUNT') or 0),'artifact_name':f"dsh-browser-smoke-v3-{os.environ['GITHUB_RUN_ID']}" if present else None,'artifact_encrypted':False}
          (t/'result.json').write_text(json.dumps(result,ensure_ascii=False,separators=(',',':')))
          PY
          CID="$(cat "$RUNNER_TEMP/client-id.txt")"
          node workspace/scripts/dsh-handoff-crypto.mjs encrypt-json "$RUNNER_TEMP/result.json" "$RUNNER_TEMP/session-key.b64" "$RUNNER_TEMP/result.enc.json" "$CID" "$GITHUB_RUN_ID"
      - name: Publish final
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.dsh.outputs.exit_code }}
          FILE_PRESENT: ${{ steps.files.outputs.present }}
          FILE_COUNT: ${{ steps.files.outputs.count }}
        run: |
          set -euo pipefail
          CODE="${EXIT_CODE:-1}"; STATUS=error; [ "$CODE" = 0 ] && STATUS=success; { [ "$CODE" = 124 ] || [ "$CODE" = 137 ]; } && STATUS=timeout
          ART=false; [ "${FILE_PRESENT:-false}" = true ] && ART=true; CID="$(cat "$RUNNER_TEMP/client-id.txt" 2>/dev/null || printf unknown)"
          printf '{"status":"%s","run_id":"%s","client_id":"%s","browser":"playwright-mcp-v3","artifact_present":%s,"artifact_count":%s,"artifact_encrypted":false}\n' "$STATUS" "$GITHUB_RUN_ID" "$CID" "$ART" "${FILE_COUNT:-0}" > "$RUNNER_TEMP/status.json"
          put(){ P="$1"; F="$2"; M="$3"; C="$(base64 -w0 "$F")"; S="$(gh api "repos/$GITHUB_REPOSITORY/contents/$P?ref=main" --jq .sha 2>/dev/null || true)"; if [ -n "$S" ]; then gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$P" -f message="$M" -f content="$C" -f sha="$S" -f branch=main >/dev/null; else gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$P" -f message="$M" -f content="$C" -f branch=main >/dev/null; fi; }
          [ -f "$RUNNER_TEMP/result.enc.json" ] && put dsh-browser-smoke-v3-result.enc.json "$RUNNER_TEMP/result.enc.json" 'Update browser smoke v3 result [skip ci]'
          put dsh-browser-smoke-v3-status.json "$RUNNER_TEMP/status.json" 'Update browser smoke v3 status [skip ci]'
      - name: Validate
        run: |
          [ "${{ steps.dsh.outputs.exit_code }}" = 0 ] || exit 1
          [ "${{ steps.files.outputs.present }}" = true ] || exit 1
