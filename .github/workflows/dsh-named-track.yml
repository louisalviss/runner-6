name: DSH Named Track Download

on:
  push:
    branches: [main]
    paths:
      - "dsh-named-track-request.txt"

permissions:
  contents: write

concurrency:
  group: runner-6-dsh-named-track
  cancel-in-progress: true

jobs:
  named-track:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DSH_VERSION: "0.1.0-rc.7"
      PLAYWRIGHT_MCP_VERSION: "0.0.78"
    steps:
      - uses: actions/checkout@v4
        with:
          path: workspace
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Runtime paths
        run: echo "DSH_HOME=$RUNNER_TEMP/dsh-home" >> "$GITHUB_ENV"
      - name: Configure OpenRouter
        run: |
          set -euo pipefail
          mkdir -p "$DSH_HOME"
          cat > "$DSH_HOME/settings.yaml" <<'YAML'
          llm-pi-ai:
            providers:
              openrouter-v4:
                displayName: OpenRouter DeepSeek V4 Pro
                apiKeyEnv: OPENROUTER_API_KEY
                api: openai-completions
                baseURL: https://openrouter.ai/api/v1
                compat:
                  thinkingFormat: openrouter
                models:
                  - id: deepseek/deepseek-v4-pro
                    name: DeepSeek V4 Pro
                    contextWindow: 1000000
                    maxTokens: 8192
                    input: [text]
          agent-default-model:
            provider: openrouter-v4
            model: deepseek/deepseek-v4-pro
          YAML
          chmod 600 "$DSH_HOME/settings.yaml"
      - name: Restore DSH runtime
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/runner6-dsh-runtime
            ~/.npm
          key: runner6-dsh-runtime-${{ runner.os }}-rc7-pwmcp078-v1
          fail-on-cache-miss: true
      - name: Activate runtime
        run: bash workspace/scripts/activate-dsh-runtime.sh
      - name: Configure browser
        run: bash workspace/scripts/setup-dsh-playwright.sh workspace
      - name: Ask DSH to find exact track and queue audio
        id: dsh
        working-directory: workspace
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -uo pipefail
          REQUEST="$(cat dsh-named-track-request.txt)"
          TASK="Find the exact requested music track using the Playwright browser: $REQUEST. Do not substitute another song. Resolve the canonical artist/title and choose the cleanest matching public source, preferring an official artist/label/Topic YouTube upload when available. Then queue audio with: bash scripts/dsh-request-audio.sh SOURCE_URL \"artist - title\". Do not run yt-dlp yourself. Create dsh-handoff/selection.json with selected_title, artist, selected_url, reason. Finish with DSH_NAMED_TRACK_QUEUED."
          set +e
          timeout --signal=TERM --kill-after=10s 180s "$DSH_BIN" --profile headless "$TASK" > "$RUNNER_TEMP/dsh-output.txt" 2> "$RUNNER_TEMP/dsh-error.txt"
          CODE=$?
          set -e
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          unset REQUEST TASK OPENROUTER_API_KEY
      - name: Execute queued audio download
        if: steps.dsh.outputs.exit_code == '0'
        working-directory: workspace
        run: |
          set -euo pipefail
          test -s .dsh-download-request.json
          URL="$(python - <<'PY'
          import json
          print(json.load(open('.dsh-download-request.json'))['url'])
          PY
          )"
          bash scripts/dsh-download-media.sh "$URL" 720
      - name: Validate handoff
        id: validate
        if: always()
        working-directory: workspace
        run: |
          set -euo pipefail
          PRESENT=false
          if [ -s dsh-handoff/handoff.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('dsh-handoff/handoff.json').read_text())
          assert h.get('media_type') == 'audio', h
          p=Path(h['relative_path'])
          assert p.exists() and p.stat().st_size > 0, h
          print(json.dumps(h, ensure_ascii=False))
          PY
            PRESENT=true
          fi
          echo "present=$PRESENT" >> "$GITHUB_OUTPUT"
      - name: Upload handoff
        if: steps.validate.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dsh-named-track-${{ github.run_id }}
          path: workspace/dsh-handoff/
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
      - name: Publish status
        if: always()
        working-directory: workspace
        env:
          GH_TOKEN: ${{ github.token }}
          PRESENT: ${{ steps.validate.outputs.present }}
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/status.json"
          import json, os
          from pathlib import Path
          data={'status':'success' if os.environ.get('PRESENT')=='true' else 'error','run_id':os.environ['GITHUB_RUN_ID'],'artifact_present':os.environ.get('PRESENT')=='true'}
          for key,path in [('selection','dsh-handoff/selection.json'),('handoff','dsh-handoff/handoff.json')]:
              p=Path(path)
              if p.exists():
                  try:data[key]=json.loads(p.read_text())
                  except:pass
          print(json.dumps(data,ensure_ascii=False,separators=(',',':')))
          PY
          C="$(base64 -w0 "$RUNNER_TEMP/status.json")"
          S="$(gh api "repos/$GITHUB_REPOSITORY/contents/dsh-named-track-status.json?ref=main" --jq .sha 2>/dev/null || true)"
          if [ -n "$S" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/dsh-named-track-status.json" -f message='Update DSH named track status [skip ci]' -f content="$C" -f sha="$S" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/dsh-named-track-status.json" -f message='Update DSH named track status [skip ci]' -f content="$C" -f branch=main >/dev/null
          fi
      - name: Validate job result
        run: '[ "${{ steps.validate.outputs.present }}" = true ] || exit 1'
