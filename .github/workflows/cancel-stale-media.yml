name: Cancel stale DSH media run

on:
  push:
    branches: [main]
    paths:
      - "cancel-stale-media-trigger.txt"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale media run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/actions/runs/32286954619/cancel || true
