name: DSH Media Selection Smoke

on:
  push:
    branches: [main]
    paths:
      - "dsh-media-selection-smoke-trigger.txt"

permissions:
  contents: write

concurrency:
  group: runner-6-dsh-media-selection-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DSH_VERSION: "0.1.0-rc.7"
      PLAYWRIGHT_MCP_VERSION: "0.0.78"
    steps:
      - uses: actions/checkout@v4
        with:
          path: workspace
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Runtime paths
        run: echo "DSH_HOME=$RUNNER_TEMP/dsh-home" >> "$GITHUB_ENV"
      - name: Configure OpenRouter
        run: |
          mkdir -p "$DSH_HOME"
          cat > "$DSH_HOME/settings.yaml" <<'YAML'
          llm-pi-ai:
            providers:
              openrouter-v4:
                displayName: OpenRouter DeepSeek V4 Pro
                apiKeyEnv: OPENROUTER_API_KEY
                api: openai-completions
                baseURL: https://openrouter.ai/api/v1
                compat:
                  thinkingFormat: openrouter
                models:
                  - id: deepseek/deepseek-v4-pro
                    name: DeepSeek V4 Pro
                    contextWindow: 1000000
                    maxTokens: 8192
                    input: [text]
          agent-default-model:
            provider: openrouter-v4
            model: deepseek/deepseek-v4-pro
          YAML
          chmod 600 "$DSH_HOME/settings.yaml"
      - name: Restore DSH runtime
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/runner6-dsh-runtime
            ~/.npm
          key: runner6-dsh-runtime-${{ runner.os }}-rc7-pwmcp078-v1
          fail-on-cache-miss: true
      - name: Activate runtime
        run: bash workspace/scripts/activate-dsh-runtime.sh
      - name: Configure browser
        run: bash workspace/scripts/setup-dsh-playwright.sh workspace
      - name: Run selection smoke
        id: dsh
        working-directory: workspace
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -uo pipefail
          TASK='Use the Playwright browser to search YouTube for official Blender Foundation / Blender Studio open-movie videos suitable as focused source material. This is a SELECTION-ONLY smoke test: do not download and do not queue a download. Follow AGENTS.md default media-selection policy. Compare at least 3 plausible visible results using title and displayed duration when available. Select one focused result in the preferred 3-15 minute range; reject results over 30 minutes unless there is no shorter credible match. Create dsh-handoff/selection.json containing: selected_title, selected_url, duration_text, reason, and candidates (at least 3 objects with title,url,duration_text). Then answer MEDIA_SELECTION_OK.'
          set +e
          timeout --signal=TERM --kill-after=10s 180s "$DSH_BIN" --profile headless "$TASK" > "$RUNNER_TEMP/output.txt" 2> "$RUNNER_TEMP/error.txt"
          CODE=$?
          set -e
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
      - name: Validate selection
        id: validate
        run: |
          set -euo pipefail
          test "${{ steps.dsh.outputs.exit_code }}" = 0
          test -s workspace/dsh-handoff/selection.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('workspace/dsh-handoff/selection.json').read_text())
          assert p.get('selected_url','').startswith('http')
          assert len(p.get('candidates',[])) >= 3
          assert p.get('duration_text')
          print(json.dumps(p, ensure_ascii=False))
          PY
      - name: Upload selection artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-media-selection-${{ github.run_id }}
          path: workspace/dsh-handoff/selection.json
          retention-days: 1
      - name: Publish status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATUS=success
          [ "${{ steps.dsh.outputs.exit_code }}" = 0 ] || STATUS=error
          [ -s workspace/dsh-handoff/selection.json ] || STATUS=error
          python - "$STATUS" <<'PY'
          import json,sys
          from pathlib import Path
          status=sys.argv[1]
          data={'status':status}
          p=Path('workspace/dsh-handoff/selection.json')
          if p.exists():
              try: data['selection']=json.loads(p.read_text())
              except: pass
          Path('/tmp/selection-status.json').write_text(json.dumps(data,ensure_ascii=False,separators=(',',':')))
          PY
          C="$(base64 -w0 /tmp/selection-status.json)"
          S="$(gh api "repos/$GITHUB_REPOSITORY/contents/dsh-media-selection-smoke-status.json?ref=main" --jq .sha 2>/dev/null || true)"
          if [ -n "$S" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/dsh-media-selection-smoke-status.json" -f message='Update DSH media selection smoke [skip ci]' -f content="$C" -f sha="$S" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/dsh-media-selection-smoke-status.json" -f message='Update DSH media selection smoke [skip ci]' -f content="$C" -f branch=main >/dev/null
          fi
