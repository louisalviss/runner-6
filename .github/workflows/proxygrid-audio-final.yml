name: ProxyGrid Voice Final

on:
  push:
    branches: [main]
    paths:
      - 'proxygrid-audio-final-trigger.txt'

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Install audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install edge-tts

      - name: Generate scene-timed NamMinh Neural voice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/chunks
          cat > out/script.json <<'JSON'
          [
            {"start":0.0,"end":4.0,"text":"Checkpoint, lỗi phiên, tài khoản bị hạn chế? Đừng vội đổ lỗi cho công cụ."},
            {"start":4.0,"end":8.0,"text":"IP tái sử dụng, độ tin cậy thấp hay sai vị trí đều có thể làm phiên kém ổn định."},
            {"start":8.0,"end":14.0,"text":"Với Proxy Grid, bạn chọn quốc gia, khu vực, loại phiên và quản lý mọi kết nối ngay trên một bảng điều khiển."},
            {"start":14.0,"end":20.0,"text":"Chọn vị trí, thiết lập phiên rồi kết nối. Mọi thứ sẵn sàng chỉ trong vài giây."},
            {"start":20.0,"end":25.0,"text":"Hạ tầng ổn định hơn, mở rộng dễ hơn, đổi khu vực linh hoạt và giảm thời gian xử lý lỗi."},
            {"start":25.0,"end":30.0,"text":"Muốn vận hành gọn hơn? Truy cập Proxy Grid chấm ai ô, và bắt đầu ngay."}
          ]
          JSON
          python - <<'PY'
          import asyncio, json, subprocess
          import edge_tts
          scenes=json.load(open('out/script.json',encoding='utf-8'))
          async def synth():
              for i,s in enumerate(scenes):
                  c=edge_tts.Communicate(s['text'], voice='vi-VN-NamMinhNeural', rate='-3%', pitch='-1Hz')
                  await c.save(f'out/chunks/raw_{i}.mp3')
          asyncio.run(synth())
          for i,s in enumerate(scenes):
              raw=f'out/chunks/raw_{i}.mp3'
              dur=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nk=1:nw=1',raw]).decode().strip())
              target=(s['end']-s['start'])-0.45
              if dur > target:
                  speed=dur/target; xs=[]
                  while speed>2: xs.append(2.0); speed/=2
                  xs.append(speed)
                  tempo=','.join(f'atempo={x:.6f}' for x in xs)
              else: tempo='anull'
              subprocess.run(['ffmpeg','-y','-v','error','-i',raw,'-af',f'{tempo},highpass=f=75,lowpass=f=12500,acompressor=threshold=-18dB:ratio=2.0:attack=12:release=150,loudnorm=I=-16:TP=-1.5:LRA=7','-ar','48000','-ac','1',f'out/chunks/fit_{i}.wav'],check=True)
          PY
          ffmpeg -y -v error \
            -i out/chunks/fit_0.wav -i out/chunks/fit_1.wav -i out/chunks/fit_2.wav \
            -i out/chunks/fit_3.wav -i out/chunks/fit_4.wav -i out/chunks/fit_5.wav \
            -filter_complex "[0:a]adelay=180[a0];[1:a]adelay=4180[a1];[2:a]adelay=8180[a2];[3:a]adelay=14180[a3];[4:a]adelay=20180[a4];[5:a]adelay=25180[a5];[a0][a1][a2][a3][a4][a5]amix=inputs=6:duration=longest:normalize=0,apad=pad_dur=30,atrim=0:30[a]" \
            -map "[a]" -ar 48000 -ac 1 out/voice.wav
          ffprobe -v error -show_format -show_streams -of json out/voice.wav > out/ffprobe.json

      - name: Upload neural voice package
        uses: actions/upload-artifact@v4
        with:
          name: proxygrid-voice-${{ github.run_id }}
          path: |
            out/voice.wav
            out/script.json
            out/ffprobe.json
          retention-days: 3
          compression-level: 0

      - name: Publish status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATUS=success
          [ -s out/voice.wav ] || STATUS=failed
          printf '{"status":"%s","run_id":"%s","artifact_name":"proxygrid-voice-%s"}\n' "$STATUS" "$GITHUB_RUN_ID" "$GITHUB_RUN_ID" > /tmp/status.json
          C="$(base64 -w0 /tmp/status.json)"
          S="$(gh api "repos/$GITHUB_REPOSITORY/contents/proxygrid-audio-final-status.json?ref=main" --jq .sha 2>/dev/null || true)"
          if [ -n "$S" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/proxygrid-audio-final-status.json" -f message='Update ProxyGrid voice status [skip ci]' -f content="$C" -f sha="$S" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/proxygrid-audio-final-status.json" -f message='Update ProxyGrid voice status [skip ci]' -f content="$C" -f branch=main >/dev/null
          fi
