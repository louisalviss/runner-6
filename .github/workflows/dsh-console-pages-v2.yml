name: Deploy DSH Console v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dsh-console/**"
      - ".github/workflows/dsh-console-pages-v2.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dsh-console-pages-v2
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Embed deploy metadata
        run: |
          printf '{"run_id":"%s","sha":"%s","status":"built"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > dsh-console/deploy.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dsh-console
      - id: deployment
        uses: actions/deploy-pages@v4
