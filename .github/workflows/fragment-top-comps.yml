name: Fragment Top Candidate Cross Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fragment-top-comps.yml"
      - "fragment-top-comps-trigger.txt"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: python -m pip install requests beautifulsoup4
      - name: Cross-check top candidates
        run: |
          mkdir -p crawl-results
          python - <<'PY'
          import requests,re,json,time,urllib.parse
          from bs4 import BeautifulSoup
          from pathlib import Path
          names=['hotelhq','tokenaudit','jobsai','agentbox','seopro','agentops','agentlink','mintwallet','buyetf','aijou','aiduo','aidoc']
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 AppleWebKit/537.36 Chrome/140 Safari/537.36','Accept-Language':'en-US,en;q=0.9'})
          out=[]
          for n in names:
            row={'username':n}
            try:
              u='https://fragment.com/username/'+n
              r=s.get(u,timeout=25)
              soup=BeautifulSoup(r.text,'html.parser')
              lines=[re.sub(r'\s+',' ',x.strip()) for x in soup.get_text('\n').splitlines() if x.strip()]
              row['status']=r.status_code; row['url']=r.url; row['title']=soup.title.get_text(' ',strip=True) if soup.title else ''
              row['text']=lines[:180]
              # gather structured-looking blocks/tables
              row['tables']=[]
              for table in soup.find_all('table')[:10]:
                rows=[]
                for tr in table.find_all('tr')[:50]:
                  cells=[re.sub(r'\s+',' ',c.get_text(' ',strip=True)) for c in tr.find_all(['th','td'])]
                  if cells: rows.append(cells)
                if rows: row['tables'].append(rows)
            except Exception as e: row['error']=repr(e)
            out.append(row); time.sleep(.25)
          cap=time.time()
          Path('crawl-results/fragment-top-comps.json').write_text(json.dumps({'captured_at':cap,'results':out},ensure_ascii=False,indent=2))
          compact=[f'CAPTURED_AT={cap}']
          for r in out:
            compact.append('\n## @'+r['username']+' '+str(r.get('status'))+' '+r.get('url',''))
            compact += (r.get('text') or [])[:100]
          Path('crawl-results/fragment-top-comps.txt').write_text('\n'.join(compact)+'\n',encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "runner-6-bot"
          git config user.email "runner-6-bot@users.noreply.github.com"
          git add crawl-results/fragment-top-comps.json crawl-results/fragment-top-comps.txt
          git commit -m "Update Fragment top candidate cross-check" || exit 0
          git pull --rebase origin main || true
          git push
