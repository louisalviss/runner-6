name: Runner 6 DSH Secure V3

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "Encrypted DSH envelope"
        required: true
        type: string
      model_variant:
        description: "Model A/B variant; baseline unchanged unless explicitly selected"
        required: false
        type: choice
        options:
          - baseline
          - flash1017
        default: baseline
      diagnostic_patch:
        description: "Experiment only: leave normal patch enabled or remove it to isolate bootstrap failure"
        required: false
        type: choice
        options:
          - normal
          - none
        default: normal
  push:
    branches: [main]
    paths:
      - "dsh-secure-v2-smoke-request.txt"

permissions:
  contents: write

concurrency:
  group: runner-6-dsh-secure-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  dsh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DSH_VERSION: "0.1.0-rc.7"
      DSH_PROVIDER: "openrouter-v4"
      DSH_MODEL: ${{ inputs.model_variant == 'flash1017' && 'deepseek/deepseek-v4.1-flash-1017' || 'deepseek/deepseek-v4-pro' }}
      DSH_STATUS_BRANCH: ${{ github.ref_name }}
      PLAYWRIGHT_MCP_VERSION: "0.0.78"

    steps:
      - name: Checkout without credentials
        uses: actions/checkout@v4
        with:
          path: workspace
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Runtime paths
        run: echo "DSH_HOME=$RUNNER_TEMP/dsh-home" >> "$GITHUB_ENV"

      - name: Resolve encrypted request
        env:
          SECURE_PAYLOAD: ${{ inputs.payload }}
        run: |
          set -euo pipefail
          if [ -n "${SECURE_PAYLOAD:-}" ]; then
            printf '%s' "$SECURE_PAYLOAD" > "$RUNNER_TEMP/request.enc"
          else
            cp workspace/dsh-secure-v2-smoke-request.txt "$RUNNER_TEMP/request.enc"
          fi
          chmod 600 "$RUNNER_TEMP/request.enc"

      - name: Decrypt request in runner memory
        id: decrypt
        env:
          DSH_CHAT_PRIVATE_KEY_B64: ${{ secrets.DSH_CHAT_PRIVATE_KEY_B64 }}
        run: |
          set +e
          node workspace/scripts/dsh-handoff-crypto.mjs decrypt-envelope \
            "$RUNNER_TEMP/request.enc" \
            "$RUNNER_TEMP/dsh-task.txt" \
            "$RUNNER_TEMP/dsh-session-key.b64" \
            "$RUNNER_TEMP/client-id.txt" \
            >"$RUNNER_TEMP/decrypt.log" 2>&1
          CODE=$?
          set -e
          rm -f "$RUNNER_TEMP/decrypt.log"
          if [ "$CODE" -eq 0 ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'status=ready' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'status=decrypt_error' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish safe start status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CID="$(cat "$RUNNER_TEMP/client-id.txt" 2>/dev/null || printf unknown)"
          STATUS="${{ steps.decrypt.outputs.status }}"
          [ "${{ steps.decrypt.outputs.ready }}" = true ] && STATUS=started
          printf '{"status":"%s","run_id":"%s","client_id":"%s","provider":"%s","model":"%s","browser":"playwright-mcp","runtime":"cached-dsh","artifact_present":false}\n' \
            "$STATUS" "$GITHUB_RUN_ID" "$CID" "$DSH_PROVIDER" "$DSH_MODEL" > "$RUNNER_TEMP/status.json"
          C="$(base64 -w0 "$RUNNER_TEMP/status.json")"
          S="$(gh api "repos/$GITHUB_REPOSITORY/contents/dsh-status.json?ref=$DSH_STATUS_BRANCH" --jq .sha 2>/dev/null || true)"
          if [ -n "$S" ]; then gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/dsh-status.json" -f message='DSH secure v3 started [skip ci]' -f content="$C" -f sha="$S" -f branch="$DSH_STATUS_BRANCH" >/dev/null; else gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/dsh-status.json" -f message='DSH secure v3 started [skip ci]' -f content="$C" -f branch="$DSH_STATUS_BRANCH" >/dev/null; fi

      - name: Configure OpenRouter
        if: steps.decrypt.outputs.ready == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$DSH_HOME"
          case "$DSH_MODEL" in
            deepseek/deepseek-v4-pro|deepseek/deepseek-v4.1-flash-1017) ;;
            *) echo "Unknown DSH_MODEL variant"; exit 3 ;;
          esac
          cat > "$DSH_HOME/settings.yaml" <<YAML
          llm-pi-ai:
            providers:
              openrouter-v4:
                displayName: OpenRouter DeepSeek V4 Pro
                apiKeyEnv: OPENROUTER_API_KEY
                api: openai-completions
                baseURL: https://openrouter.ai/api/v1
                compat:
                  thinkingFormat: openrouter
                models:
                  - id: deepseek/deepseek-v4-pro
                    name: DeepSeek V4 Pro
                    contextWindow: 1000000
                    maxTokens: 16384
                    input: [text]
                  - id: deepseek/deepseek-v4.1-flash-1017
                    name: DeepSeek V4.1 Flash 1017 (opt-in)
                    contextWindow: 1000000
                    maxTokens: 4096
                    input: [text]
          agent-default-model:
            provider: openrouter-v4
            model: $DSH_MODEL
          YAML
          chmod 600 "$DSH_HOME/settings.yaml"

      - name: Restore verified DSH runtime
        if: steps.decrypt.outputs.ready == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/runner6-dsh-runtime
            ~/.npm
          key: runner6-dsh-runtime-${{ runner.os }}-rc7-pwmcp078-v1
          fail-on-cache-miss: false

      - name: Activate DSH runtime
        if: steps.decrypt.outputs.ready == 'true'
        run: bash workspace/scripts/activate-dsh-runtime.sh

      - name: Configure Playwright MCP browser
        if: steps.decrypt.outputs.ready == 'true'
        run: bash workspace/scripts/setup-dsh-playwright.sh workspace

      - name: Disable patch for isolated bootstrap diagnosis
        if: inputs.diagnostic_patch == 'none'
        run: |
          set -euo pipefail
          if [ -f "$DSH_HOME/cordis.patch.yml" ]; then
            mv "$DSH_HOME/cordis.patch.yml" "$RUNNER_TEMP/cordis.patch.diag.disabled"
          fi
          echo "DSH diagnostic patch disabled (experiment branch only)"

      - name: Sanity DSH binary
        if: steps.decrypt.outputs.ready == 'true'
        run: timeout 20s "$DSH_BIN" --version

      - name: Validate DSH composed profile without calling model
        id: dsh_preflight
        if: steps.decrypt.outputs.ready == 'true'
        run: |
          set +e
          timeout 20s "$DSH_BIN" --profile headless --dump-config > "$RUNNER_TEMP/dsh-profile-dump.txt" 2> "$RUNNER_TEMP/dsh-profile-error.txt"
          CODE=$?
          set -e
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          if [ "$CODE" = 0 ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
          python - <<'PY'
          import os,re
          from pathlib import Path
          t=Path(os.environ["RUNNER_TEMP"])
          dump=(t/"dsh-profile-dump.txt").read_text(errors="replace")
          err=(t/"dsh-profile-error.txt").read_text(errors="replace")
          words=("error","profile","headless","bundle","module","patch","cordis","not","found","missing","unknown","model","settings","schema","yaml","mcp","browser","invalid","plugin","resolve","import","failed","config","duplicate","no","such","file")
          hits=[v for v in words if re.search(r"\b"+re.escape(v)+r"\b",err,re.I)]
          print("DSH_PREFLIGHT_SAFE stderr_flags="+(",".join(hits) or "none")+" stderr_len="+str(len(err))+" dump_len="+str(len(dump))+" compaction_row="+str("compaction-basic" in dump)+" browser_row="+str("browser-playwright-mcp" in dump))
          PY
      - name: Check OpenRouter key quota without inference
        id: key_gate
        if: steps.decrypt.outputs.ready == 'true' && steps.dsh_preflight.outputs.ok == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python - <<'PY'
          import json,os,urllib.request,urllib.error
          key=os.environ.get("OPENROUTER_API_KEY","")
          code="unavailable"
          good=False
          hard_cap=False
          try:
            if len(key)<16: raise ValueError("KEY_MISSING")
            req=urllib.request.Request("https://openrouter.ai/api/v1/key",headers={"Authorization":"Bearer "+key,"Accept":"application/json"})
            with urllib.request.urlopen(req,timeout=12) as response:
              code=str(response.status)
              doc=json.loads(response.read(32768))
            data=doc.get("data") if isinstance(doc,dict) else None
            if not isinstance(data,dict):raise ValueError("RESPONSE_INVALID")
            cap=data.get("limit")
            available=data.get("limit_remaining")
            hard_cap=cap is not None and available is not None
            good=hard_cap and float(available)>=0.01 and float(cap)>0
          except urllib.error.HTTPError as e:
            code=str(e.code)
          except Exception:
            pass
          print("OPENROUTER_SAFE_KEY_GATE http="+code+" hard_cap="+str(hard_cap)+" enough_for_canary="+str(good))
          with open(os.environ["GITHUB_OUTPUT"],"a") as o:o.write("ok="+("true" if good else "false")+"\n")
          PY
      - name: Run DSH brain
        id: run_dsh
        if: steps.decrypt.outputs.ready == 'true' && steps.dsh_preflight.outputs.ok == 'true' && steps.key_gate.outputs.ok == 'true'
        working-directory: workspace
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            : > "$RUNNER_TEMP/dsh-output.txt"
            printf '%s\n' 'OPENROUTER_API_KEY missing' > "$RUNNER_TEMP/dsh-error.txt"
            echo 'missing_key=true' >> "$GITHUB_OUTPUT"
            echo 'exit_code=3' >> "$GITHUB_OUTPUT"
            echo 'timed_out=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TASK="$(cat "$RUNNER_TEMP/dsh-task.txt")"
          set +e
          timeout --signal=TERM --kill-after=10s 210s \
            "$DSH_BIN" --profile headless "$TASK" \
            > "$RUNNER_TEMP/dsh-output.txt" 2> "$RUNNER_TEMP/dsh-error.txt"
          CODE=$?
          set -e
          echo 'missing_key=false' >> "$GITHUB_OUTPUT"
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          if [ "$CODE" = 124 ] || [ "$CODE" = 137 ]; then echo 'timed_out=true' >> "$GITHUB_OUTPUT"; else echo 'timed_out=false' >> "$GITHUB_OUTPUT"; fi
          # Report fixed diagnostic categories only. Never emit raw task, stderr, response or credentials.
          python - <<'PY'
          import os,re
          from pathlib import Path
          t=Path(os.environ["RUNNER_TEMP"])
          err=(t/"dsh-error.txt").read_text(errors="replace") if (t/"dsh-error.txt").exists() else ""
          out=(t/"dsh-output.txt").read_text(errors="replace") if (t/"dsh-output.txt").exists() else ""
          combined=(err+"\n"+out).lower()
          patterns=[
            ("provider_auth",r"(401|403|unauthorized|invalid.api.key|authentication failed)"),
            ("provider_quota",r"(402|429|rate limit|insufficient credits|quota exceeded)"),
            ("provider_model",r"(model.*(not found|unsupported|invalid)|404.*model|unknown model)"),
            ("model_settings",r"(yaml|config|setting|invalid.*model|model.*invalid)"),
            ("tool_runtime",r"(mcp|playwright|browser|tool.*(failed|error|missing))"),
            ("native_binary",r"(cannot find module|module not found|no such file|spawn.*enoent|node-pty)"),
            ("api_request",r"(fetch failed|network|connection refused|timeout|status code)"),
            ("parser",r"(syntaxerror|parse error|zoderror|invalid type)"),
          ]
          category=next((name for name,regex in patterns if re.search(regex,combined)),"unknown")
          signatures={
            "plugin_import":r"(failed to (load|import)|cannot find module|module not found)",
            "plugin_start":r"(failonstartuperror|failed to start|mcp server|mcp-client)",
            "headless_profile":r"(headless.*(unknown|invalid|not found)|unknown profile)",
            "yaml_schema":r"(yamlexception|yaml parse|invalid configuration|unknown tag|duplicat(e|ed).*(id|key))",
            "process_env":r"(undefined.*(env|cli)|playwright_mcp_cli)",
            "provider_auth":r"(401|403|unauthorized|invalid api key)",
            "model_not_found":r"(unknown model|model.*not found|model.*not supported)",
            "api_failed":r"(fetch failed|http error|status code)",
            "node_runtime":r"(err_module|typeerror|referenceerror|syntaxerror)",
            "tool_error":r"(tool execution|tool call|browser error)",
          }
          flags=[name for name,pat in signatures.items() if re.search(pat,combined)]
          safe_terms=("error","failed","cannot","could","resolve","module","require","import","package","exports","plugin","plugins","cordova","cordis","patch","configuration","config","profile","invalid","unknown","model","provider","api","key","yaml","parse","json","schema","mcp","browser","server","tool","node","pty","koffi","file","directory","permission","spawn","timeout","undefined","startup","initialize","initialization","object","function","argument","option","missing","script","process","dependency","environment","runtime","disabled","duplicate")
          safe_hits=[x for x in safe_terms if re.search(r"\b"+re.escape(x)+r"\b",combined)]
          # Emit only words from a fixed public diagnostic vocabulary; drop all other tokens.
          public_vocab=set(("error fail failed cordis patch profile runtime boot startup node file path line process create read write load loading launch started completion exception stack at from into with on in the a an and or of for is was not no to by has had thrown message code entry object key target method type class default script module import plugin browser mcp server client connection data package settings yaml invalid unexpected unsupported duplicate cannot find missing unknown resolved resolve directory config configuration argument option environment env native builtin dependency dependencies version register plugin id insert array map value field apply applying conflict reject reason headless source model provider tool startup disabled output input home root run runs running initialization initializing initializing initialize user custom profile fatal warning unhandled sandbox subprocess local failed terminated state dead abort aborted internal body request invalid nonempty empty should expected undefined null unsupported implementation relative absolute string number true false call returned registry event timer socket initial creation bug validate validation cannot execute profile cordis.patch.yml").split())
          for idx,line in enumerate(err.splitlines()[:8]):
            tokens=re.findall(r"[A-Za-z]+",line.lower())
            filtered=[w if w in public_vocab else "_" for w in tokens[:30]]
            if filtered:print("DSH_SAFE_LINE_"+str(idx)+" "+" ".join(filtered))

          for ln in err.splitlines():
            if "is not a function" in ln:
              expression=ln.split("is not a function",1)[0]
              identifiers=re.findall(r"[A-Za-z_$][A-Za-z0-9_$]*",expression)
              picked=[x for x in identifiers[-4:] if len(x)<=52 and x.lower() not in ("typeerror","error")]
              print("DSH_SAFE_MISSING_METHOD "+",".join(picked))
              break
          provider_signatures={
            "insufficient_credits":r"(insufficient.*credit|credit.*insufficient|out of credits)",
            "quota_or_spending":r"(quota|budget|limit_remaining|in.flight.budget|exhausted)",
            "rate_limited":r"(rate.limited|too many requests|\b429\b)",
            "auth_failed":r"(unauthorized|invalid.api.key|\b401\b|\b403\b)",
            "payment_required":r"(payment required|\b402\b)",
            "model_unavailable":r"(model.*not found|no endpoints|unsupported model|\b404\b)",
            "bad_request":r"(invalid request|\b400\b|\b422\b)",
            "context_limit":r"(context length|max tokens|token limit)",
          }
          provider_hits=[name for name,pat in provider_signatures.items() if re.search(pat,combined)]
          print("DSH_SAFE_PROVIDER_FLAGS "+(",".join(provider_hits) or "none"))
          print("DSH_SAFE_WORDS "+",".join(safe_hits[:35]))
          print("DSH_SAFE_DIAGNOSTIC category="+category+" flags="+(",".join(flags) or "none")+" stderr_present="+str(bool(err))+" stdout_present="+str(bool(out))+" stderr_bytes="+str(len(err.encode("utf-8"))))
          PY
          unset TASK OPENROUTER_API_KEY

      - name: Execute queued media download
        id: download
        if: steps.decrypt.outputs.ready == 'true'
        working-directory: workspace
        run: |
          set -euo pipefail
          REQ=.dsh-download-request.json
          if [ ! -s "$REQ" ]; then
            echo 'requested=false' >> "$GITHUB_OUTPUT"
            echo 'status=none' >> "$GITHUB_OUTPUT"
            echo 'exit_code=0' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('.dsh-download-request.json').read_text())
          if p.get('v') != 1 or p.get('action') != 'download_media': raise SystemExit('invalid download request')
          u=str(p.get('url',''))
          if not u.startswith(('https://','http://')): raise SystemExit('invalid download URL')
          h=int(p.get('max_height',720))
          if h < 144 or h > 2160: raise SystemExit('invalid max height')
          Path('.dsh-download-url.txt').write_text(u)
          Path('.dsh-download-height.txt').write_text(str(h))
          PY
          URL="$(cat .dsh-download-url.txt)"
          HEIGHT="$(cat .dsh-download-height.txt)"
          echo 'requested=true' >> "$GITHUB_OUTPUT"
          set +e
          bash scripts/dsh-download-media.sh "$URL" "$HEIGHT" \
            >"$RUNNER_TEMP/download-output.txt" 2>"$RUNNER_TEMP/download-error.txt"
          CODE=$?
          set -e
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          if [ "$CODE" -eq 0 ] && [ -s dsh-handoff/handoff.json ]; then
            echo 'status=success' >> "$GITHUB_OUTPUT"
          else
            echo 'status=failed' >> "$GITHUB_OUTPUT"
          fi
          rm -f .dsh-download-request.json .dsh-download-url.txt .dsh-download-height.txt

      - name: Collect deliverable files
        id: media
        if: steps.decrypt.outputs.ready == 'true'
        run: |
          set -euo pipefail
          mkdir -p workspace/dsh-handoff
          find workspace/dsh-handoff -type f -size +0c -print | sort > "$RUNNER_TEMP/files.txt" || true
          COUNT="$(wc -l < "$RUNNER_TEMP/files.txt" | tr -d ' ')"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          [ "$COUNT" -gt 0 ] && echo 'present=true' >> "$GITHUB_OUTPUT" || echo 'present=false' >> "$GITHUB_OUTPUT"

      - name: Upload plain deliverable artifact
        if: steps.media.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dsh-media-${{ github.run_id }}
          path: workspace/dsh-handoff/
          retention-days: 2
          compression-level: 0
          if-no-files-found: error

      - name: Build encrypted result
        if: steps.decrypt.outputs.ready == 'true'
        env:
          MISSING_KEY: ${{ steps.run_dsh.outputs.missing_key }}
          TIMED_OUT: ${{ steps.run_dsh.outputs.timed_out }}
          EXIT_CODE: ${{ steps.run_dsh.outputs.exit_code }}
          DOWNLOAD_REQUESTED: ${{ steps.download.outputs.requested }}
          DOWNLOAD_STATUS: ${{ steps.download.outputs.status }}
          DOWNLOAD_EXIT_CODE: ${{ steps.download.outputs.exit_code }}
          MEDIA_PRESENT: ${{ steps.media.outputs.present }}
          MEDIA_COUNT: ${{ steps.media.outputs.count }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP'])
          w=Path('workspace')
          out=(t/'dsh-output.txt').read_text(errors='replace') if (t/'dsh-output.txt').exists() else ''
          err=(t/'dsh-error.txt').read_text(errors='replace') if (t/'dsh-error.txt').exists() else ''
          dlout=(t/'download-output.txt').read_text(errors='replace') if (t/'download-output.txt').exists() else ''
          dlerr=(t/'download-error.txt').read_text(errors='replace') if (t/'download-error.txt').exists() else ''
          try: code=int(os.environ.get('EXIT_CODE') or 1)
          except: code=1
          requested=os.environ.get('DOWNLOAD_REQUESTED')=='true'
          dlstatus=os.environ.get('DOWNLOAD_STATUS') or 'none'
          media=os.environ.get('MEDIA_PRESENT')=='true'
          handoff=None
          hp=w/'dsh-handoff'/'handoff.json'
          if hp.exists():
            try: handoff=json.loads(hp.read_text())
            except: handoff=None
          files=[]
          fp=t/'files.txt'
          if fp.exists():
            for line in fp.read_text().splitlines():
              p=line.strip()
              if p.startswith('workspace/'): p=p[len('workspace/'):]
              if p: files.append(p)
          if requested and dlstatus=='success' and media:
            status='success'
          elif requested and dlstatus!='success':
            status='error'
          elif os.environ.get('MISSING_KEY')=='true':
            status='missing_openrouter_key'
          elif os.environ.get('TIMED_OUT')=='true':
            status='timeout'
          elif code!=0:
            status='error'
          else:
            status='success'
          worker_note=''
          if requested:
            if dlstatus=='success':
              worker_note='\n\nRunner download: success.'
              if handoff:
                worker_note += f"\nSource: {handoff.get('source_url','')}\nSaved: {handoff.get('relative_path','')}\nBytes: {handoff.get('bytes','')}"
            else:
              worker_note='\n\nRunner download: failed.'
              if dlerr.strip(): worker_note += '\n' + dlerr.strip()[-4000:]
          result={
            'status':status,
            'output':(out+worker_note)[:100000],
            'stderr':err[:50000],
            'exit_code':code,
            'run_id':os.environ['GITHUB_RUN_ID'],
            'client_id':(t/'client-id.txt').read_text().strip(),
            'browser':'playwright-mcp',
            'runtime':'cached-dsh',
            'download_requested':requested,
            'download_status':dlstatus,
            'download_exit_code':int(os.environ.get('DOWNLOAD_EXIT_CODE') or 0),
            'handoff':handoff,
            'artifact_present':media,
            'artifact_count':int(os.environ.get('MEDIA_COUNT') or 0),
            'artifact_files':files,
            'artifact_name':f"dsh-media-{os.environ['GITHUB_RUN_ID']}" if media else None,
            'artifact_encrypted':False
          }
          (t/'result.json').write_text(json.dumps(result,ensure_ascii=False,separators=(',',':')))
          (t/'final-status.txt').write_text(status)
          PY
          CID="$(cat "$RUNNER_TEMP/client-id.txt")"
          node workspace/scripts/dsh-handoff-crypto.mjs encrypt-json \
            "$RUNNER_TEMP/result.json" "$RUNNER_TEMP/dsh-session-key.b64" \
            "$RUNNER_TEMP/result.enc.json" "$CID" "$GITHUB_RUN_ID"
          node workspace/scripts/dsh-mirror-encrypt.mjs \
            "$RUNNER_TEMP/result.json" workspace/dsh-mirror-public.pem \
            "$RUNNER_TEMP/mirror-result.enc.json" "$GITHUB_RUN_ID"
          rm -f "$RUNNER_TEMP/result.json"

      - name: Publish encrypted result and safe final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DECRYPT_READY: ${{ steps.decrypt.outputs.ready }}
          DECRYPT_STATUS: ${{ steps.decrypt.outputs.status }}
          MEDIA_PRESENT: ${{ steps.media.outputs.present }}
        run: |
          set -euo pipefail
          CID="$(cat "$RUNNER_TEMP/client-id.txt" 2>/dev/null || printf unknown)"
          STATUS="${DECRYPT_STATUS:-error}"
          if [ "${DECRYPT_READY:-false}" = true ] && [ -f "$RUNNER_TEMP/final-status.txt" ]; then STATUS="$(cat "$RUNNER_TEMP/final-status.txt")"; fi
          ART=false; [ "${MEDIA_PRESENT:-false}" = true ] && ART=true
          printf '{"status":"%s","run_id":"%s","client_id":"%s","provider":"%s","model":"%s","browser":"playwright-mcp","runtime":"cached-dsh","artifact_present":%s,"artifact_encrypted":false,"mirror_present":%s}\n' \
            "$STATUS" "$GITHUB_RUN_ID" "$CID" "$DSH_PROVIDER" "$DSH_MODEL" "$ART" "$([ -f "$RUNNER_TEMP/mirror-result.enc.json" ] && printf true || printf false)" > "$RUNNER_TEMP/status.json"
          put(){ P="$1"; F="$2"; M="$3"; C="$(base64 -w0 "$F")"; S="$(gh api "repos/$GITHUB_REPOSITORY/contents/$P?ref=$DSH_STATUS_BRANCH" --jq .sha 2>/dev/null || true)"; if [ -n "$S" ]; then gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$P" -f message="$M" -f content="$C" -f sha="$S" -f branch="$DSH_STATUS_BRANCH" >/dev/null; else gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$P" -f message="$M" -f content="$C" -f branch="$DSH_STATUS_BRANCH" >/dev/null; fi; }
          [ -f "$RUNNER_TEMP/result.enc.json" ] && put dsh-result.enc.json "$RUNNER_TEMP/result.enc.json" 'Update encrypted DSH v3 result [skip ci]'
          [ -f "$RUNNER_TEMP/mirror-result.enc.json" ] && put dsh-mirror-result.enc.json "$RUNNER_TEMP/mirror-result.enc.json" 'Update encrypted DSH mirror result [skip ci]'
          put dsh-status.json "$RUNNER_TEMP/status.json" 'Update safe DSH v3 status [skip ci]'
          rm -f "$RUNNER_TEMP/dsh-task.txt" "$RUNNER_TEMP/dsh-session-key.b64" "$RUNNER_TEMP/request.enc" "$RUNNER_TEMP/dsh-output.txt" "$RUNNER_TEMP/dsh-error.txt" "$RUNNER_TEMP/download-output.txt" "$RUNNER_TEMP/download-error.txt" "$RUNNER_TEMP/mirror-result.enc.json"

      - name: Validate
        if: always()
        env:
          DECRYPT_READY: ${{ steps.decrypt.outputs.ready }}
        run: |
          [ "${DECRYPT_READY:-false}" = true ] || { echo 'Secure decrypt failed'; exit 1; }
          STATUS="$(cat "$RUNNER_TEMP/final-status.txt" 2>/dev/null || printf error)"
          [ "$STATUS" = success ] || { echo "DSH secure v3 failed: $STATUS"; exit 1; }
          echo success
