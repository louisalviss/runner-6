name: Runner 6 DSH Media Pipeline

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Encrypted DSH media request
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - "dsh-media-secure-request.txt"

permissions:
  contents: write

concurrency:
  group: runner-6-dsh-media
  cancel-in-progress: true

jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DSH_VERSION: "0.1.0-rc.7"
      DSH_PROVIDER: "openrouter-v4"
      DSH_MODEL: "deepseek/deepseek-v4-pro"

    steps:
      - name: Checkout without credentials
        uses: actions/checkout@v4
        with:
          path: workspace
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set runtime
        run: echo "DSH_HOME=$RUNNER_TEMP/dsh-home" >> "$GITHUB_ENV"

      - name: Resolve encrypted request
        env:
          INPUT_PAYLOAD: ${{ github.event.inputs.payload }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_PAYLOAD:-}" ]; then
            printf '%s' "$INPUT_PAYLOAD" > "$RUNNER_TEMP/media-request.enc"
          else
            cp workspace/dsh-media-secure-request.txt "$RUNNER_TEMP/media-request.enc"
          fi
          chmod 600 "$RUNNER_TEMP/media-request.enc"

      - name: Decrypt request in runner memory
        id: decrypt
        env:
          DSH_CHAT_PRIVATE_KEY_B64: ${{ secrets.DSH_CHAT_PRIVATE_KEY_B64 }}
        run: |
          set +e
          node workspace/scripts/dsh-handoff-crypto.mjs decrypt-envelope \
            "$RUNNER_TEMP/media-request.enc" \
            "$RUNNER_TEMP/media-task.txt" \
            "$RUNNER_TEMP/media-session-key.b64" \
            "$RUNNER_TEMP/media-client-id.txt"
          CODE=$?
          set -e
          if [ "$CODE" -eq 0 ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'status=planning' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'status=decrypt_error' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish safe start status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CLIENT_ID="$(cat "$RUNNER_TEMP/media-client-id.txt" 2>/dev/null || printf unknown)"
          STATUS="${{ steps.decrypt.outputs.status }}"
          printf '{"status":"%s","run_id":"%s","client_id":"%s","provider":"%s","model":"%s","artifact_present":false}\n' \
            "$STATUS" "$GITHUB_RUN_ID" "$CLIENT_ID" "$DSH_PROVIDER" "$DSH_MODEL" > "$RUNNER_TEMP/media-status.json"
          CONTENT="$(base64 -w0 "$RUNNER_TEMP/media-status.json")"
          SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/dsh-media-status.json?ref=main" --jq .sha 2>/dev/null || true)"
          if [ -n "$SHA" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/dsh-media-status.json" -f message='DSH media planning [skip ci]' -f content="$CONTENT" -f sha="$SHA" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/dsh-media-status.json" -f message='DSH media planning [skip ci]' -f content="$CONTENT" -f branch=main >/dev/null
          fi

      - name: Configure DSH OpenRouter
        if: steps.decrypt.outputs.ready == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$DSH_HOME"
          cat > "$DSH_HOME/settings.yaml" <<'YAML'
          llm-pi-ai:
            providers:
              openrouter-v4:
                displayName: OpenRouter DeepSeek V4 Pro
                apiKeyEnv: OPENROUTER_API_KEY
                api: openai-completions
                baseURL: https://openrouter.ai/api/v1
                compat:
                  thinkingFormat: openrouter
                models:
                  - id: deepseek/deepseek-v4-pro
                    name: DeepSeek V4 Pro
                    contextWindow: 1000000
                    maxTokens: 8192
                    input: [text]
          agent-default-model:
            provider: openrouter-v4
            model: deepseek/deepseek-v4-pro
          YAML
          chmod 600 "$DSH_HOME/settings.yaml"

      - name: Build private planner prompt
        if: steps.decrypt.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          tmp=Path(os.environ['RUNNER_TEMP'])
          task=(tmp/'media-task.txt').read_text(errors='replace')
          rules='''You are a media execution planner. Do NOT call any tools and do NOT execute commands. Return exactly one JSON object, no markdown, no commentary.\nSchema:\n{"version":1,"status":"ready","timeout_seconds":180,"steps":[...],"outputs":["relative/file.mp4"]}\nAllowed steps only:\n1) {"op":"download","url":"https://...","output":"relative/file"} for a direct HTTPS resource the user is authorized to use.\n2) {"op":"ffprobe","args":[...]}\n3) {"op":"ffmpeg","args":[...]}\nAll paths must be relative to the workspace. Never use shell metacharacters, shell scripts, yt-dlp, package installation, git, credentials, local secrets, or absolute paths. Network access is allowed only through the download step. If the request cannot be represented safely with these operations, return {"version":1,"status":"cannot_execute","reason":"..."}. Keep timeout_seconds <= 600.\nUser request follows:\n'''
          (tmp/'media-planner-prompt.txt').write_text(rules+task)
          PY
          chmod 600 "$RUNNER_TEMP/media-planner-prompt.txt"

      - name: Ask DSH for plan only
        id: planner
        if: steps.decrypt.outputs.ready == 'true'
        working-directory: workspace
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -uo pipefail
          PROMPT="$(cat "$RUNNER_TEMP/media-planner-prompt.txt")"
          set +e
          timeout --signal=KILL 180s npx --yes "@deepseek-ai/dsh@$DSH_VERSION" --profile headless "$PROMPT" \
            > "$RUNNER_TEMP/media-plan-raw.txt" 2> "$RUNNER_TEMP/media-plan-error.txt"
          CODE=$?
          set -e
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          unset PROMPT OPENROUTER_API_KEY

      - name: Parse structured plan
        id: parse
        if: steps.decrypt.outputs.ready == 'true'
        run: |
          set +e
          node workspace/scripts/dsh-media-plan-parse.mjs "$RUNNER_TEMP/media-plan-raw.txt" "$RUNNER_TEMP/media-plan.json" \
            > /dev/null 2> "$RUNNER_TEMP/media-parse-error.txt"
          CODE=$?
          set -e
          if [ "$CODE" -eq 0 ]; then echo 'ready=true' >> "$GITHUB_OUTPUT"; else echo 'ready=false' >> "$GITHUB_OUTPUT"; fi

      - name: Execute bounded media plan
        id: execute
        if: steps.parse.outputs.ready == 'true'
        working-directory: workspace
        run: |
          set +e
          node scripts/dsh-media-exec.mjs \
            "$RUNNER_TEMP/media-plan.json" \
            "$RUNNER_TEMP/media-exec-result.json" \
            "$RUNNER_TEMP/media-manifest.json" \
            > /dev/null 2> "$RUNNER_TEMP/media-exec-error.txt"
          CODE=$?
          set -e
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Encrypt media outputs
        id: artifact
        if: steps.parse.outputs.ready == 'true'
        working-directory: workspace
        run: |
          set -euo pipefail
          COUNT="$(python -c 'import json,os; p=os.path.join(os.environ["RUNNER_TEMP"],"media-manifest.json"); print(json.load(open(p))["count"] if os.path.exists(p) else 0)')"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" = 0 ]; then
            echo 'present=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          m=json.load(open(Path(os.environ['RUNNER_TEMP'])/'media-manifest.json'))
          with open(Path(os.environ['RUNNER_TEMP'])/'media-files.txt','w') as f:
              for x in m['files']: f.write(x['path']+'\n')
          PY
          tar -cf "$RUNNER_TEMP/dsh-media.tar" -T "$RUNNER_TEMP/media-files.txt"
          node scripts/dsh-handoff-crypto.mjs encrypt-file \
            "$RUNNER_TEMP/dsh-media.tar" \
            "$RUNNER_TEMP/media-session-key.b64" \
            "$RUNNER_TEMP/dsh-media.dshenc"
          rm -f "$RUNNER_TEMP/dsh-media.tar" "$RUNNER_TEMP/media-files.txt"
          echo 'present=true' >> "$GITHUB_OUTPUT"

      - name: Upload encrypted media artifact
        if: steps.artifact.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dsh-media-${{ github.run_id }}
          path: ${{ runner.temp }}/dsh-media.dshenc
          retention-days: 2
          compression-level: 0
          if-no-files-found: error

      - name: Build encrypted result
        if: steps.decrypt.outputs.ready == 'true'
        env:
          PLAN_READY: ${{ steps.parse.outputs.ready }}
          PLANNER_EXIT: ${{ steps.planner.outputs.exit_code }}
          EXEC_EXIT: ${{ steps.execute.outputs.exit_code }}
          ARTIFACT_PRESENT: ${{ steps.artifact.outputs.present }}
          ARTIFACT_COUNT: ${{ steps.artifact.outputs.count }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          tmp=Path(os.environ['RUNNER_TEMP'])
          def text(name,limit=50000):
              p=tmp/name
              return p.read_text(errors='replace')[:limit] if p.exists() else ''
          plan=None
          if (tmp/'media-plan.json').exists():
              try: plan=json.loads((tmp/'media-plan.json').read_text())
              except: pass
          exec_result=None
          if (tmp/'media-exec-result.json').exists():
              try: exec_result=json.loads((tmp/'media-exec-result.json').read_text())
              except: pass
          if os.environ.get('PLAN_READY')!='true': status='plan_error'
          elif exec_result and exec_result.get('status')=='success': status='success'
          elif exec_result and exec_result.get('status')=='cannot_execute': status='cannot_execute'
          else: status='exec_error'
          art=os.environ.get('ARTIFACT_PRESENT')=='true'
          result={
            'status':status,'run_id':os.environ['GITHUB_RUN_ID'],
            'client_id':text('media-client-id.txt',200).strip(),
            'planner_exit_code':int(os.environ.get('PLANNER_EXIT') or 1),
            'executor_exit_code':int(os.environ.get('EXEC_EXIT') or 1),
            'plan':plan,'executor':exec_result,
            'planner_stderr':text('media-plan-error.txt'),
            'parse_error':text('media-parse-error.txt'),
            'executor_error':text('media-exec-error.txt'),
            'artifact_present':art,
            'artifact_count':int(os.environ.get('ARTIFACT_COUNT') or 0),
            'artifact_name':f"dsh-media-{os.environ['GITHUB_RUN_ID']}" if art else None,
          }
          (tmp/'media-result.json').write_text(json.dumps(result,ensure_ascii=False,separators=(',',':')))
          (tmp/'media-final-status.txt').write_text(status)
          PY
          CLIENT_ID="$(cat "$RUNNER_TEMP/media-client-id.txt")"
          node workspace/scripts/dsh-handoff-crypto.mjs encrypt-json \
            "$RUNNER_TEMP/media-result.json" \
            "$RUNNER_TEMP/media-session-key.b64" \
            "$RUNNER_TEMP/dsh-media-result.enc.json" \
            "$CLIENT_ID" "$GITHUB_RUN_ID"
          rm -f "$RUNNER_TEMP/media-result.json"

      - name: Publish encrypted result and safe final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_PRESENT: ${{ steps.artifact.outputs.present }}
        run: |
          set -euo pipefail
          CLIENT_ID="$(cat "$RUNNER_TEMP/media-client-id.txt" 2>/dev/null || printf unknown)"
          STATUS="$(cat "$RUNNER_TEMP/media-final-status.txt" 2>/dev/null || printf error)"
          ART=false; [ "${ARTIFACT_PRESENT:-false}" = 'true' ] && ART=true
          printf '{"status":"%s","run_id":"%s","client_id":"%s","provider":"%s","model":"%s","artifact_present":%s}\n' \
            "$STATUS" "$GITHUB_RUN_ID" "$CLIENT_ID" "$DSH_PROVIDER" "$DSH_MODEL" "$ART" > "$RUNNER_TEMP/media-status.json"
          put_file() {
            local path="$1" file="$2" msg="$3" content sha
            content="$(base64 -w0 "$file")"
            sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha 2>/dev/null || true)"
            if [ -n "$sha" ]; then
              gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message="$msg" -f content="$content" -f sha="$sha" -f branch=main >/dev/null
            else
              gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message="$msg" -f content="$content" -f branch=main >/dev/null
            fi
          }
          [ -f "$RUNNER_TEMP/dsh-media-result.enc.json" ] && put_file dsh-media-result.enc.json "$RUNNER_TEMP/dsh-media-result.enc.json" 'Update encrypted DSH media result [skip ci]'
          put_file dsh-media-status.json "$RUNNER_TEMP/media-status.json" 'Update safe DSH media status [skip ci]'
          rm -f "$RUNNER_TEMP/media-task.txt" "$RUNNER_TEMP/media-session-key.b64" "$RUNNER_TEMP/media-planner-prompt.txt" "$RUNNER_TEMP/media-plan-raw.txt" "$RUNNER_TEMP/media-plan.json" "$RUNNER_TEMP/dsh-media.dshenc"

      - name: Validate pipeline
        if: always()
        run: |
          STATUS="$(cat "$RUNNER_TEMP/media-final-status.txt" 2>/dev/null || printf error)"
          case "$STATUS" in success|cannot_execute) echo "$STATUS" ;; *) echo "DSH media pipeline failed: $STATUS"; exit 1 ;; esac
