name: Anime Combat Viral Beat-Sync Render

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "anime-phonk-learned-render-trigger.txt"

permissions:
  contents: write

concurrency:
  group: runner-6-anime-combat-viral-pattern
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ROOT: dsh-handoff/anime-combat-viral
      FINAL: dsh-handoff/anime-combat-viral/final/anime_combat_viral_pattern_v2.mp4
      STATUS_FILE: anime-phonk-learned-render-status.json
    steps:
      - uses: actions/checkout@v4

      - name: Install media and analysis tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-opencv python3-numpy python3-pil
          bash scripts/setup-dsh-media-tools.sh
          mkdir -p "$ROOT" "$ROOT/final"
          cp dsh-anime-phonk-references.json "$ROOT/references.json"
          cp dsh-anime-combat-production-candidates.json "$ROOT/source-candidates.json"

      - name: Publish running status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '{"status":"running","phase":"rank_references","run_id":"%s","artifact_present":false,"flow":"viral-pattern-learning-v0.8-beat-sync"}\n' "$GITHUB_RUN_ID" > /tmp/status.json
          C="$(base64 -w0 /tmp/status.json)"
          S="$(gh api "repos/$GITHUB_REPOSITORY/contents/$STATUS_FILE?ref=main" --jq .sha 2>/dev/null || true)"
          if [ -n "$S" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$STATUS_FILE" -f message='Anime combat beat-sync render running [skip ci]' -f content="$C" -f sha="$S" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$STATUS_FILE" -f message='Anime combat beat-sync render running [skip ci]' -f content="$C" -f branch=main >/dev/null
          fi

      - name: Rank viral references from observed data
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math, datetime
          from pathlib import Path
          root=Path('dsh-handoff/anime-combat-viral')
          data=json.load(open(root/'references.json'))
          now=datetime.date(2026,8,21)
          ranked=[]
          for r in data['references']:
              v=max(1,int(r.get('views',0))); likes=int(r.get('likes',0)); comments=int(r.get('comments',0)); shares=int(r.get('shares',0))
              d=datetime.date.fromisoformat(r['publish_date']); age=max(1,(now-d).days); velocity=v/age
              engagement=(likes+comments+shares)/v; share_rate=shares/v
              score=math.log10(v)+2.5*engagement+0.12*math.log10(max(1,velocity))+0.25*share_rate
              x=dict(r); x.update({'age_days':age,'views_per_day':round(velocity,2),'engagement_rate':round(engagement,5),'share_rate':round(share_rate,5),'data_score':round(score,5)})
              ranked.append(x)
          ranked.sort(key=lambda x:x['data_score'],reverse=True)
          for i,r in enumerate(ranked,1): r['rank']=i; r['runtime_index']=i
          out={'captured_at':data['captured_at'],'ranking_rule':data['ranking_rule'],'music_rule':data.get('music_rule'),'ranked':ranked}
          (root/'reference-ranking.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Download ranked viral references with DSH media helper
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/refs.tsv
          import json
          rs=json.load(open('dsh-handoff/anime-combat-viral/reference-ranking.json'))['ranked']
          for r in rs: print(r['runtime_index'],r['download_url'],sep='\t')
          PY
          while IFS=$'\t' read -r I URL; do
            echo "=== ranked ref$I $URL ==="
            rm -rf dsh-handoff/downloads dsh-handoff/handoff.json
            mkdir -p dsh-handoff/downloads "$ROOT/ref$I"
            bash scripts/dsh-download-media.sh "$URL" 720
            P="$(python -c "import json;print(json.load(open('dsh-handoff/handoff.json'))['relative_path'])")"
            ffmpeg -nostdin -hide_banner -y -v error -i "$P" -map 0:v:0 -map 0:a? -c:v libx264 -preset veryfast -crf 19 -c:a aac -ar 48000 -b:a 160k -movflags +faststart "$ROOT/ref$I/reference.mp4"
            test -s "$ROOT/ref$I/reference.mp4"
          done < /tmp/refs.tsv

      - name: Analyze all viral references
        run: |
          set -euo pipefail
          N="$(python -c "import json;print(len(json.load(open('$ROOT/reference-ranking.json'))['ranked']))")"
          for I in $(seq 1 "$N"); do
            python scripts/analyze-viral-edit.py "$ROOT/ref$I/reference.mp4" "$ROOT/ref$I/analysis"
          done

      - name: Synthesize multi-reference viral combat grammar
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, statistics
          from pathlib import Path
          root=Path('dsh-handoff/anime-combat-viral')
          ranking=json.load(open(root/'reference-ranking.json'))
          n=len(ranking['ranked'])
          aa=[json.load(open(root/f'ref{i}/analysis/analysis.json')) for i in range(1,n+1)]
          def vals(path):
              out=[]
              for x in aa:
                  cur=x
                  for k in path: cur=cur.get(k)
                  if cur is not None: out.append(float(cur))
              return out
          cuts=vals(['visual','median_cut_interval_sec']); bpms=vals(['audio','bpm']); durs=vals(['visual','duration_sec'])
          first_imp=[x['impact_times_sec'][0] for x in aa if x.get('impact_times_sec')]
          freeze_lengths=[]
          for x in aa:
              for a,b in x['visual'].get('freeze_segments_sec',[]):
                  if b>a: freeze_lengths.append(b-a)
          def q(v,p):
              if not v:return None
              s=sorted(v); idx=(len(s)-1)*p; lo=int(idx); hi=min(len(s)-1,lo+1); f=idx-lo
              return round(s[lo]*(1-f)+s[hi]*f,3)
          diagnostics={}
          for k in ('flash_times_sec','zoom_times_sec','shake_times_sec','color_burst_times_sec'):
              ds=[len(x['visual'].get(k,[]))/max(.1,x['visual']['duration_sec']) for x in aa]
              diagnostics[k.replace('_times_sec','_density_per_sec')]=round(statistics.median(ds),3)
          g={
            'reference_count':n,
            'reference_ranking':ranking['ranked'],
            'timing_profile':{
              'reference_duration_sec_range':[q(durs,.25),q(durs,.75)],
              'median_cut_interval_sec_range':[q(cuts,.25),q(cuts,.75)],
              'first_impact_median_sec':round(statistics.median(first_imp),3) if first_imp else None,
              'freeze_duration_sec_range':[q(freeze_lengths,.25),q(freeze_lengths,.75)] if freeze_lengths else None
            },
            'audio_profile':{'bpm_values':bpms,'bpm_median':round(statistics.median(bpms),2) if bpms else None},
            'effect_diagnostics_only':diagnostics,
            'do_not_target_effect_density':True,
            'core_rules':[
              'hook with a recognizable high-salience combat state immediately',
              'preserve chronological action units so attack, contact, counter and payoff remain readable',
              'use pacing variation rather than cutting on every beat',
              'align strongest music beats/onsets with real visual impacts',
              'escalate toward a stronger late payoff/finisher rather than a flat montage',
              'localize post effects to genuine impacts; source choreography carries most of the energy'
            ],
            'optional_rules':[
              'brief pre-impact anticipation when the source action naturally supports it',
              'short aftermath/pose/reaction ending when it improves closure or looping'
            ],
            'outlier_rejection':[
              'do not reproduce creator-specific logos, captions, exact shot order or exact timestamps',
              'do not mechanically reproduce measured shake/flash/zoom densities',
              'do not use mixed reference-video audio as the production music bed'
            ]
          }
          (root/'learned-combat-grammar.json').write_text(json.dumps(g,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(g,ensure_ascii=False,indent=2))
          PY

      - name: Rank and download production combat source
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math
          from pathlib import Path
          root=Path('dsh-handoff/anime-combat-viral')
          d=json.load(open(root/'source-candidates.json')); ranked=[]
          for r in d['candidates']:
              v=max(1,int(r.get('social_views',0))); likes=int(r.get('likes',0)); shares=int(r.get('shares',0))
              eng=(likes+shares)/v
              score=math.log10(v)+2.0*eng+0.60*float(r.get('combat_continuity_score',0))+0.40*float(r.get('visual_quality_score',0))
              x=dict(r); x['engagement_rate']=round(eng,5); x['data_score']=round(score,5); ranked.append(x)
          ranked.sort(key=lambda x:x['data_score'],reverse=True)
          for i,r in enumerate(ranked,1): r['rank']=i
          out={'ranking_rule':d['ranking_rule'],'ranked':ranked,'selected':ranked[0]}
          (root/'source-selection.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('/tmp/source_url').write_text(ranked[0]['url']); Path('/tmp/source_name').write_text(ranked[0]['name'])
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          URL="$(cat /tmp/source_url)"
          echo "Selected source: $(cat /tmp/source_name)"
          rm -rf dsh-handoff/downloads dsh-handoff/handoff.json
          mkdir -p dsh-handoff/downloads
          bash scripts/dsh-download-media.sh "$URL" 720
          P="$(python -c "import json;print(json.load(open('dsh-handoff/handoff.json'))['relative_path'])")"
          ffmpeg -nostdin -hide_banner -y -v error -i "$P" -t 420 -map 0:v:0 -map 0:a? -c:v libx264 -preset veryfast -crf 18 -c:a aac -ar 48000 -b:a 160k -movflags +faststart "$ROOT/final/source.mp4"
          test -s "$ROOT/final/source.mp4"
          python scripts/analyze-viral-edit.py "$ROOT/final/source.mp4" "$ROOT/final/source-analysis"

      - name: Select and download clean song master from viral music identity
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('dsh-handoff/anime-combat-viral')
          rs=json.load(open(root/'reference-ranking.json'))['ranked']
          candidates=[r for r in rs if r.get('music_identity',{}).get('clean_audio_url')]
          if not candidates:
              raise SystemExit('no identifiable clean music source in ranked references')
          pick=candidates[0]
          m=pick['music_identity']
          out={
            'reference_rank':pick['rank'],
            'reference_creator':pick['creator'],
            'reference_title':pick['caption_or_title'],
            'title':m['title'],
            'artist':m['artist'],
            'clean_audio_url':m['clean_audio_url'],
            'bpm_reference':m.get('bpm_reference'),
            'selection_reason':m.get('selection_reason')
          }
          (root/'music-selection.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('/tmp/music_url').write_text(m['clean_audio_url'])
          Path('/tmp/music_title').write_text(f"{m['title']} — {m['artist']}")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          rm -rf dsh-handoff/downloads dsh-handoff/handoff.json
          mkdir -p dsh-handoff/downloads
          bash scripts/dsh-download-media.sh "$(cat /tmp/music_url)#dsh-audio" 720
          P="$(python -c "import json;print(json.load(open('dsh-handoff/handoff.json'))['relative_path'])")"
          ffmpeg -nostdin -hide_banner -y -v error -i "$P" -vn -ar 48000 -ac 2 -c:a pcm_s16le "$ROOT/final/music-master.wav"
          test "$(stat -c '%s' "$ROOT/final/music-master.wav")" -gt 1000000
          ffprobe -v error -show_streams -show_format -of json "$ROOT/final/music-master.wav" > "$ROOT/final/music-master-ffprobe.json"
          python - <<'PY'
          import json
          p=json.load(open('dsh-handoff/anime-combat-viral/final/music-master-ffprobe.json'))
          a=next(s for s in p['streams'] if s['codec_type']=='audio')
          d=float(p['format']['duration'])
          assert int(a['sample_rate'])==48000,a['sample_rate']
          assert d>30,d
          print('CLEAN MUSIC PASS',a['codec_name'],a['sample_rate'],d)
          PY

      - name: Render beat-synced readable combat edit
        run: |
          set -euo pipefail
          python scripts/render-learned-anime-combat.py \
            "$ROOT/final/source.mp4" \
            "$ROOT/final/music-master.wav" \
            "$ROOT/learned-combat-grammar.json" \
            "$ROOT/final/source-analysis/analysis.json" \
            "$FINAL" \
            "$ROOT/final/edit-plan.json" \
            --music-title "$(cat /tmp/music_title)"
          python scripts/analyze-viral-edit.py "$FINAL" "$ROOT/final/output-analysis"

      - name: QA clean audio and beat synchronization
        run: |
          set -euo pipefail
          ffprobe -v error -show_streams -show_format -of json "$FINAL" > "$ROOT/final/ffprobe.json"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('dsh-handoff/anime-combat-viral')
          p=json.load(open(root/'final/ffprobe.json')); plan=json.load(open(root/'final/edit-plan.json'))
          v=next(s for s in p['streams'] if s['codec_type']=='video')
          a=next(s for s in p['streams'] if s['codec_type']=='audio')
          d=float(p['format']['duration'])
          assert int(v['width'])==1080 and int(v['height'])==1920,(v['width'],v['height'])
          assert 19.90<=d<=20.10,d
          assert int(p['format']['size'])>1000000,p['format']['size']
          assert int(a['sample_rate'])==48000,a['sample_rate']
          assert plan['mode']=='beat_synced_choreography',plan['mode']
          assert plan['music']['track_type']=='clean_song_master',plan['music']
          assert plan['music']['source_audio_in_mix'] is False,plan['music']
          assert plan['music']['synthetic_sfx_in_mix'] is False,plan['music']
          assert plan['impact_sync_count']>=3,plan['impact_sync_count']
          assert plan['max_beat_sync_error_sec']<=0.035,plan['max_beat_sync_error_sec']
          assert plan['max_speed_deviation_from_1x']<=0.35,plan['max_speed_deviation_from_1x']
          manifest={
            'reference_ranking':json.load(open(root/'reference-ranking.json')),
            'music_selection':json.load(open(root/'music-selection.json')),
            'source_selection':json.load(open(root/'source-selection.json')),
            'learned_grammar':json.load(open(root/'learned-combat-grammar.json')),
            'edit_plan':plan,
            'qa':{
              'duration_sec':d,
              'width':int(v['width']),
              'height':int(v['height']),
              'video_codec':v['codec_name'],
              'audio_codec':a['codec_name'],
              'audio_sample_rate':int(a['sample_rate']),
              'bytes':int(p['format']['size']),
              'impact_sync_count':plan['impact_sync_count'],
              'max_beat_sync_error_sec':plan['max_beat_sync_error_sec']
            },
            'acceptance':'clean song-only audio + deterministic beat-sync QA passed; final visual acceptance still requires contact-sheet/mobile review'
          }
          (root/'final/SOURCE_MANIFEST.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print('QA PASS',manifest['qa'])
          PY

      - name: Upload final beat-sync artifact
        uses: actions/upload-artifact@v4
        with:
          name: anime-combat-beat-sync-final-${{ github.run_id }}
          path: |
            dsh-handoff/anime-combat-viral/reference-ranking.json
            dsh-handoff/anime-combat-viral/music-selection.json
            dsh-handoff/anime-combat-viral/learned-combat-grammar.json
            dsh-handoff/anime-combat-viral/source-selection.json
            dsh-handoff/anime-combat-viral/ref*/analysis/analysis.json
            dsh-handoff/anime-combat-viral/ref*/analysis/contact.jpg
            dsh-handoff/anime-combat-viral/final/source-analysis/analysis.json
            dsh-handoff/anime-combat-viral/final/edit-plan.json
            dsh-handoff/anime-combat-viral/final/output-analysis/analysis.json
            dsh-handoff/anime-combat-viral/final/output-analysis/contact.jpg
            dsh-handoff/anime-combat-viral/final/ffprobe.json
            dsh-handoff/anime-combat-viral/final/music-master-ffprobe.json
            dsh-handoff/anime-combat-viral/final/SOURCE_MANIFEST.json
            dsh-handoff/anime-combat-viral/final/anime_combat_viral_pattern_v2.mp4
          if-no-files-found: error
          retention-days: 2

      - name: Publish final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -s "$FINAL" ]; then STATUS=success; PRESENT=true; else STATUS=error; PRESENT=false; fi
          printf '{"status":"%s","phase":"done","run_id":"%s","artifact_present":%s,"flow":"viral-pattern-learning-v0.8-beat-sync"}\n' "$STATUS" "$GITHUB_RUN_ID" "$PRESENT" > /tmp/status.json
          C="$(base64 -w0 /tmp/status.json)"
          S="$(gh api "repos/$GITHUB_REPOSITORY/contents/$STATUS_FILE?ref=main" --jq .sha 2>/dev/null || true)"
          if [ -n "$S" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$STATUS_FILE" -f message='Anime combat beat-sync render status [skip ci]' -f content="$C" -f sha="$S" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$STATUS_FILE" -f message='Anime combat beat-sync render status [skip ci]' -f content="$C" -f branch=main >/dev/null
          fi
