name: DSH Anime Phonk Render V2

on:
  push:
    branches: [main]
    paths:
      - "dsh-anime-phonk-render-v2-trigger.txt"

permissions:
  contents: write

concurrency:
  group: runner-6-dsh-anime-phonk-render-v2
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VIDEO_URL: "https://www.youtube.com/watch?v=lDzXBSxAxKw"
      MUSIC_URL: "https://www.free-stock-music.com/music/alex-productions/mp3/alex-productions-metaphonk.mp3"
      MUSIC_LICENSE_PAGE: "https://www.free-stock-music.com/alex-productions-metaphonk.html"
      MUSIC_CREDIT: "Metaphonk by Alex-Productions | https://onsound.eu/ | CC BY 3.0"
      STATUS_FILE: "dsh-anime-phonk-render-v2-status.json"
      OUTPUT_FILE: "dsh-handoff/render/sukuna_mahoraga_phonk_v2.mp4"
    steps:
      - uses: actions/checkout@v4
        with:
          path: workspace
          persist-credentials: false

      - name: Publish running status
        working-directory: workspace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '{"status":"running","phase":"setup","run_id":"%s","artifact_present":false}\n' "$GITHUB_RUN_ID" > "$RUNNER_TEMP/status.json"
          C="$(base64 -w0 "$RUNNER_TEMP/status.json")"
          S="$(gh api "repos/$GITHUB_REPOSITORY/contents/$STATUS_FILE?ref=main" --jq .sha 2>/dev/null || true)"
          if [ -n "$S" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$STATUS_FILE" -f message='Anime phonk render v2 running [skip ci]' -f content="$C" -f sha="$S" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$STATUS_FILE" -f message='Anime phonk render v2 running [skip ci]' -f content="$C" -f branch=main >/dev/null
          fi

      - name: Install ffmpeg and downloader
        working-directory: workspace
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          bash scripts/setup-dsh-media-tools.sh
          command -v ffmpeg
          command -v ffprobe

      - name: Download DSH scene
        id: video
        working-directory: workspace
        run: |
          set -euo pipefail
          rm -rf dsh-handoff
          mkdir -p dsh-handoff/downloads dsh-handoff/render
          bash scripts/dsh-download-media.sh "$VIDEO_URL" 720
          P="$(python -c "import json;print(json.load(open('dsh-handoff/handoff.json'))['relative_path'])")"
          test -s "$P"
          echo "path=$P" >> "$GITHUB_OUTPUT"

      - name: Download licensed Metaphonk MP3
        id: music
        working-directory: workspace
        run: |
          set -euo pipefail
          P="dsh-handoff/downloads/alex-productions-metaphonk.mp3"
          curl --fail --location --retry 2 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36' \
            -e "$MUSIC_LICENSE_PAGE" \
            "$MUSIC_URL" -o "$P"
          test -s "$P"
          BYTES="$(stat -c '%s' "$P")"
          test "$BYTES" -gt 500000
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1 "$P"
          echo "path=$P" >> "$GITHUB_OUTPUT"
          echo "bytes=$BYTES" >> "$GITHUB_OUTPUT"

      - name: Render edit
        working-directory: workspace
        run: |
          set -euo pipefail
          python scripts/render-dsh-anime-phonk.py \
            "${{ steps.video.outputs.path }}" \
            "${{ steps.music.outputs.path }}" \
            "$OUTPUT_FILE" \
            dsh-handoff/render/edit-analysis.json

      - name: QA
        working-directory: workspace
        run: |
          set -euo pipefail
          ffprobe -v error -show_entries stream=codec_type,width,height,codec_name -show_entries format=duration,size -of json \
            "$OUTPUT_FILE" > dsh-handoff/render/ffprobe.json
          python - <<'PY'
          import json
          p=json.load(open('dsh-handoff/render/ffprobe.json'))
          v=next(s for s in p['streams'] if s['codec_type']=='video')
          assert int(v['width'])==1080 and int(v['height'])==1920, v
          d=float(p['format']['duration'])
          assert 31 <= d <= 36, d
          assert int(p['format']['size']) > 1000000
          PY

      - name: Write music credit
        working-directory: workspace
        run: |
          cat > dsh-handoff/render/MUSIC_CREDIT.txt <<'EOF'
          Metaphonk by Alex-Productions | https://onsound.eu/
          Royalty Free Music by https://www.free-stock-music.com
          Creative Commons / Attribution 3.0 Unported License (CC BY 3.0)
          https://creativecommons.org/licenses/by/3.0/deed.en_US
          EOF

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: dsh-anime-phonk-render-v2-${{ github.run_id }}
          path: |
            workspace/dsh-handoff/render/sukuna_mahoraga_phonk_v2.mp4
            workspace/dsh-handoff/render/edit-analysis.json
            workspace/dsh-handoff/render/ffprobe.json
            workspace/dsh-handoff/render/MUSIC_CREDIT.txt
          retention-days: 2
          compression-level: 0
          if-no-files-found: error

      - name: Publish final status
        if: always()
        working-directory: workspace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/status.json"
          import json,os
          from pathlib import Path
          v=Path(os.environ['OUTPUT_FILE'])
          a=Path('dsh-handoff/render/edit-analysis.json')
          q=Path('dsh-handoff/render/ffprobe.json')
          d={
            'status':'success' if v.exists() and v.stat().st_size else 'error',
            'phase':'done',
            'run_id':os.environ['GITHUB_RUN_ID'],
            'artifact_present':bool(v.exists() and v.stat().st_size),
            'video_url':os.environ['VIDEO_URL'],
            'music_url':os.environ['MUSIC_URL'],
            'music_license_page':os.environ['MUSIC_LICENSE_PAGE'],
            'music_credit':os.environ['MUSIC_CREDIT']
          }
          if v.exists(): d['bytes']=v.stat().st_size
          if a.exists():
            try:d['edit_analysis']=json.loads(a.read_text())
            except:pass
          if q.exists():
            try:d['ffprobe']=json.loads(q.read_text())
            except:pass
          print(json.dumps(d,ensure_ascii=False,separators=(',',':')))
          PY
          C="$(base64 -w0 "$RUNNER_TEMP/status.json")"
          S="$(gh api "repos/$GITHUB_REPOSITORY/contents/$STATUS_FILE?ref=main" --jq .sha 2>/dev/null || true)"
          if [ -n "$S" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$STATUS_FILE" -f message='Update anime phonk render v2 status [skip ci]' -f content="$C" -f sha="$S" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$STATUS_FILE" -f message='Update anime phonk render v2 status [skip ci]' -f content="$C" -f branch=main >/dev/null
          fi
