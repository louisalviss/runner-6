name: DHS Avicii Blind Audio Test

on:
  push:
    branches: [main]
    paths:
      - "dsh-avicii-blind-trigger.txt"

permissions:
  contents: write

concurrency:
  group: runner-6-dsh-avicii-blind-test
  cancel-in-progress: false

jobs:
  blind-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install media tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          bash scripts/setup-dsh-media-tools.sh
          python -m pip install -q shazamio

      - name: Secret random selection
        shell: bash
        run: |
          set -euo pipefail
          YTDLP="$HOME/.local/bin/yt-dlp"
          mkdir -p "$RUNNER_TEMP/blind"
          "$YTDLP" --flat-playlist --dump-single-json "ytsearch40:Avicii Topic" > "$RUNNER_TEMP/blind/search.json" 2>/dev/null
          python - <<'PY'
          import json, random, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'blind'
          p=json.loads((root/'search.json').read_text())
          entries=p.get('entries') or []
          good=[]
          bad=('cover','reaction','tutorial','piano','karaoke','8d','slowed','sped up','nightcore','instrumental remake','mix compilation','hour')
          for e in entries:
              title=(e.get('title') or '').strip()
              channel=(e.get('channel') or e.get('uploader') or '').strip()
              low=(title+' '+channel).lower()
              if not e.get('id') or 'avicii' not in low: continue
              if any(x in low for x in bad): continue
              good.append(e)
          if not good:
              raise SystemExit('No usable Avicii candidates')
          e=random.SystemRandom().choice(good)
          url=e.get('url') or ('https://www.youtube.com/watch?v='+e['id'])
          if not str(url).startswith('http'):
              url='https://www.youtube.com/watch?v='+e['id']
          secret={
              'source_title': e.get('title'),
              'source_uploader': e.get('channel') or e.get('uploader'),
              'source_id': e.get('id'),
              'source_url': url,
          }
          (root/'selected_url.txt').write_text(url)
          (root/'secret_selection.json').write_text(json.dumps(secret,ensure_ascii=False,indent=2))
          PY
          rm -f "$RUNNER_TEMP/blind/search.json"

      - name: DHS acquire selected audio
        run: |
          set -euo pipefail
          rm -rf dsh-handoff
          URL="$(cat "$RUNNER_TEMP/blind/selected_url.txt")"
          bash scripts/dsh-download-media.sh "${URL}#dsh-audio" 720 >/dev/null 2>&1
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.load(open('dsh-handoff/handoff.json'))['relative_path']
          if not Path(p).is_file() or Path(p).stat().st_size == 0:
              raise SystemExit('DHS returned no audio')
          (Path(os.environ['RUNNER_TEMP'])/'blind'/'source_path.txt').write_text(p)
          PY

      - name: Make random blind clip
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, random, subprocess
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'blind'
          src=(root/'source_path.txt').read_text().strip()
          info=json.loads((root/'secret_selection.json').read_text())
          probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','json',src]))
          dur=float(probe['format']['duration'])
          clip_len=12.0
          lo=10.0 if dur > 45 else 0.0
          hi=max(lo, dur-clip_len-8.0)
          start=random.SystemRandom().uniform(lo,hi) if hi>lo else lo
          truth={**info,'duration_seconds':dur,'clip_start_seconds':start,'clip_duration_seconds':clip_len}
          (root/'truth.json').write_text(json.dumps(truth,ensure_ascii=False,indent=2))
          subprocess.run([
              'ffmpeg','-hide_banner','-loglevel','error','-ss',f'{start:.6f}','-i',src,'-t','12',
              '-map_metadata','-1','-vn','-ac','2','-ar','44100','-codec:a','libmp3lame','-b:a','192k',
              str(root/'blind_clip.mp3')
          ],check=True)
          if not (root/'blind_clip.mp3').is_file() or (root/'blind_clip.mp3').stat().st_size == 0:
              raise SystemExit('Blind clip was not created')
          # Destroy all selection/source hints before recognition.
          try: Path(src).unlink()
          except FileNotFoundError: pass
          for name in ('selected_url.txt','secret_selection.json','source_path.txt'):
              try: (root/name).unlink()
              except FileNotFoundError: pass
          try: Path('dsh-handoff/handoff.json').unlink()
          except FileNotFoundError: pass
          PY

      - name: Recognize blind clip only
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/blind"
          python - <<'PY'
          import asyncio, json
          from pathlib import Path
          from shazamio import Shazam
          async def main():
              # 12 s recognizer window == full 12 s clip, so match offset maps to clip start.
              out=await Shazam(segment_duration_seconds=12).recognize('blind_clip.mp3')
              track=out.get('track') or {}
              matches=out.get('matches') or []
              m=matches[0] if matches else {}
              guess={
                  'recognized': bool(track),
                  'title': track.get('title'),
                  'artist': track.get('subtitle'),
                  'shazam_track_key': track.get('key'),
                  'match_offset_seconds': m.get('offset'),
                  'match_time_skew': m.get('timeskew'),
                  'match_frequency_skew': m.get('frequencyskew')
              }
              Path('guess.json').write_text(json.dumps(guess,ensure_ascii=False,indent=2))
          asyncio.run(main())
          PY

      - name: Publish guess and truth separately
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          publish() {
            local src="$1" dst="$2" msg="$3"
            local c s
            c="$(base64 -w0 "$src")"
            s="$(gh api "repos/$GITHUB_REPOSITORY/contents/$dst?ref=main" --jq .sha 2>/dev/null || true)"
            if [ -n "$s" ]; then
              gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$dst" -f message="$msg [skip ci]" -f content="$c" -f sha="$s" -f branch=main >/dev/null
            else
              gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$dst" -f message="$msg [skip ci]" -f content="$c" -f branch=main >/dev/null
            fi
          }
          publish "$RUNNER_TEMP/blind/guess.json" "dsh-avicii-blind-guess.json" "Publish blind Avicii recognition guess"
          publish "$RUNNER_TEMP/blind/truth.json" "dsh-avicii-blind-truth.json" "Publish blind Avicii recognition truth"

      - name: Upload blind clip proof
        uses: actions/upload-artifact@v4
        with:
          name: dsh-avicii-blind-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/blind/blind_clip.mp3
            ${{ runner.temp }}/blind/guess.json
            ${{ runner.temp }}/blind/truth.json
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
